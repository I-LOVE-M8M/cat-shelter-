<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧伙食與動態管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .status-btn { transition: all 0.1s; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .active-status { border: 2px solid #fbbf24 !important; background-color: #fbbf24 !important; color: #000 !important; font-weight: bold; }
        .bg-正常, .bg-開船, .bg-駐艇, .bg-值更, .bg-碼巡, .bg-洽公, .bg-幫廚, .bg-補眠 { background-color: #1e293b; border: 1px solid #334155; }
        .bg-外宿, .bg-放假班 { background-color: #f59e0b; }
        .bg-輪休, .bg-慰休, .bg-喪假, .bg-事假, .bg-病假 { background-color: #ef4444; }
        .bg-受訓 { background-color: #3b82f6; }
        .bg-公假 { background-color: #a855f7; }
        .bg-空員 { background-color: #334155; opacity: 0.5; }
        #modal { display: none; background: rgba(0,0,0,0.9); }
        .pre-leave-active { background-color: #f43f5e !important; border: 2px solid #fb7185 !important; color: white !important; }
        .batch-check { transform: scale(1.5); cursor: pointer; }
    </style>
</head>
<body class="min-h-screen pb-32 text-xs sm:text-sm">

    <div class="max-w-4xl mx-auto px-3 pt-6 sticky top-0 z-40">
        <div class="bg-slate-800 rounded-3xl p-4 shadow-2xl border border-slate-700 flex flex-col gap-3">
            <div class="flex justify-between items-start px-2">
                <div class="space-y-1">
                    <h1 id="today-duty" class="text-amber-400 text-[10px] font-bold italic tracking-wider uppercase">載入中...</h1>
                    <div class="flex items-center gap-2">
                        <div class="text-[9px] text-slate-400 font-bold flex items-center gap-1">🌇 日落：<span id="sunset-time" class="text-rose-400">讀取中</span></div>
                        <a href="https://www.cwa.gov.tw/V8/C/M/tide.html?NSeaID=NSea06" target="_blank" class="text-[8px] bg-slate-700 px-2 py-0.5 rounded text-slate-300 border border-slate-600">⚓ 高雄港潮汐表</a>
                    </div>
                </div>
                <div class="flex gap-1.5 items-center">
                    <button onclick="openBatchModal()" class="bg-indigo-600 text-[10px] px-2 py-2 rounded-lg font-bold shadow-lg">⚡ 批次預放</button>
                    <button onclick="copyMealReport()" class="bg-blue-600 text-[10px] px-2 py-2 rounded-lg font-bold shadow-lg">📋 複製伙食</button>
                </div>
            </div>
            <div id="top-pre-leave-board" class="bg-slate-900/50 rounded-2xl p-3 border border-amber-500/30 mx-1">
                <div class="text-[10px] text-amber-500 font-bold mb-1">預放人員看板</div>
                <div id="pre-leave-list" class="text-[9px] text-slate-400 space-y-1">載入中...</div>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-3 mt-4 space-y-3" id="app"></div>

    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-2xl text-sm">
            <h2 id="modal-title" class="text-xl font-bold text-white mb-4 text-center">設定</h2>
            <div class="space-y-4">
                <div id="batch-select-container" class="hidden">
                    <label class="block text-slate-400 mb-1">已選取人員</label>
                    <div id="selected-names" class="text-amber-400 font-bold p-2 bg-slate-900 rounded"></div>
                </div>
                <select id="pre-status-select" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none">
                    <option value="輪休">輪休</option><option value="慰休">慰休</option><option value="受訓">受訓</option><option value="公假">公假</option><option value="外宿">外宿</option>
                </select>
                <div><label class="block text-slate-400 mb-1">離營時間</label><input type="datetime-local" id="start-time" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none"></div>
                <div><label class="block text-slate-400 mb-1">歸營時間</label><input type="datetime-local" id="end-time" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none"></div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeModal()" class="flex-1 bg-slate-700 py-2 rounded-xl font-bold">取消</button>
                <button onclick="saveModal()" class="flex-1 bg-indigo-600 py-2 rounded-xl font-bold">儲存</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBSQnV0F2XFXhlca57uB653lNp99WJ1Asg", authDomain: "cat-shelter-49c2e.firebaseapp.com", databaseURL: "https://cat-shelter-49c2e-default-rtdb.firebaseio.com", projectId: "cat-shelter-49c2e", storageBucket: "cat-shelter-49c2e.firebasestorage.app", messagingSenderId: "325127819712", appId: "1:325127819712:web:28650c1e975de03fedb825", measurementId: "G-STQT6CZRHS" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), memberRef = db.ref('personnel_v2');
        const allIds = ['03', '04', '05', '06', '07', '08', '09', '10', '11', '12', '13', '14', '15', '16', '17'];
        let memberStates = {}, selectedIds = new Set(), isBatch = false;

        function initApp() {
            const app = document.getElementById('app');
            app.innerHTML = "";
            allIds.forEach(id => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50 flex items-center gap-3";
                card.innerHTML = `
                    <input type="checkbox" class="batch-check" onchange="toggleSelect('${id}')" id="check-${id}">
                    <div class="flex-1">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-slate-300">${id}號</span>
                            <span id="tag-${id}" class="px-2 py-0.5 rounded text-[9px] font-bold bg-slate-700">正常</span>
                        </div>
                        <div id="detail-${id}" class="text-[8px] text-amber-400 font-mono"></div>
                    </div>
                `;
                app.appendChild(card);
            });
            fetchSunset();
        }

        function toggleSelect(id) {
            if(selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
        }

        function openBatchModal() {
            if(selectedIds.size === 0) return alert("請先勾選人員！");
            isBatch = true;
            document.getElementById('batch-select-container').classList.remove('hidden');
            document.getElementById('selected-names').textContent = Array.from(selectedIds).join(', ');
            document.getElementById('modal').style.display = 'flex';
        }

        function saveModal() {
            const s = document.getElementById('start-time').value;
            const e = document.getElementById('end-time').value;
            const ps = document.getElementById('pre-status-select').value;
            
            selectedIds.forEach(id => {
                memberRef.child(id).update({ preLeave: true, preStart: s, preEnd: e, preStatus: ps });
            });
            alert("已設定完成");
            closeModal();
            // 清除勾選
            selectedIds.forEach(id => document.getElementById(`check-${id}`).checked = false);
            selectedIds.clear();
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        async function fetchSunset() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=22.70&longitude=120.27&daily=sunset&timezone=Asia%2FTaipei`);
                const data = await res.json();
                if (data?.daily?.sunset) document.getElementById('sunset-time').textContent = data.daily.sunset[0].split('T')[1];
            } catch (e) { document.getElementById('sunset-time').textContent = "查詢失敗"; }
        }

        memberRef.on('value', (sn) => {
            memberStates = sn.val() || {};
            const preList = document.getElementById('pre-leave-list');
            preList.innerHTML = "";
            
            allIds.forEach(id => {
                const d = memberStates[id] || {};
                document.getElementById(`tag-${id}`).textContent = d.status || '正常';
                document.getElementById(`detail-${id}`).textContent = d.preLeave ? `預:${d.preStart.slice(5,11)}` : "";
                if(d.preLeave) preList.innerHTML += `<div class="flex justify-between"><span>${id}號</span><span>${d.preStart.slice(5,11)} ~ ${d.preEnd.slice(5,11)}</span></div>`;
            });
        });

        function copyMealReport() {
            let report = "【留守人員名單】\n";
            allIds.forEach(id => {
                const d = memberStates[id];
                // 邏輯：狀態為正常 且 沒有預放紀錄 = 留守
                if((!d || d.status === '正常') && !d?.preLeave) report += `${id}、`;
            });
            navigator.clipboard.writeText(report);
            alert("已複製留守人員名單");
        }

        window.onload = initApp;
    </script>
</body>
</html>
