<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人員與伙食管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: white; }
        .status-btn { transition: all 0.1s; border: 1px solid rgba(255,255,255,0.05); }
        .active-status { border: 2px solid #fbbf24 !important; background-color: #fbbf24 !important; color: #000 !important; font-weight: bold; }
        
        /* 狀態顏色 */
        .bg-正常, .bg-開船, .bg-駐艇, .bg-值更, .bg-碼巡, .bg-洽公, .bg-幫廚, .bg-補眠 { background-color: #1e293b; border: 1px solid #334155; }
        .bg-外宿 { background-color: #a855f7; }
        .bg-放假班 { background-color: #f59e0b; }
        .bg-輪休, .bg-慰休, .bg-喪假, .bg-事假, .bg-病假 { background-color: #ef4444; }
        .bg-空員 { background-color: #334155; opacity: 0.5; }

        /* 彈窗樣式 */
        #modal { display: none; background: rgba(0,0,0,0.8); }
    </style>
</head>
<body class="min-h-screen pb-24">
    <div class="max-w-4xl mx-auto px-3 pt-6 sticky top-0 z-40">
        <div class="bg-slate-800 rounded-3xl p-5 shadow-2xl border border-slate-700">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h1 id="today-duty" class="text-amber-400 text-xs font-bold mb-1 italic">載入班別中...</h1>
                    <div class="flex items-baseline gap-2">
                        <span id="meal-count" class="text-5xl font-black text-white">0</span>
                        <span class="text-sm text-slate-400 font-bold underline decoration-indigo-500">本日便當總數</span>
                    </div>
                </div>
                <div class="flex flex-col gap-2 items-end">
                    <span class="bg-indigo-600 text-[10px] px-2 py-1 rounded-md font-bold text-white shadow-sm uppercase">Ops Sqn 3 🚢</span>
                    <button onclick="copyReport()" class="bg-emerald-600 hover:bg-emerald-500 text-[10px] px-3 py-2 rounded-lg font-bold shadow-lg">📋 複製休假回報</button>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mt-2 pt-3 border-t border-slate-700/50">
                <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50">
                    <div class="text-[10px] text-slate-500 font-bold">左班用餐人數</div>
                    <div id="left-meal" class="text-xl font-bold text-indigo-400 font-mono">0</div>
                </div>
                <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50">
                    <div class="text-[10px] text-slate-500 font-bold">右班用餐人數</div>
                    <div id="right-meal" class="text-xl font-bold text-sky-400 font-mono">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-3 mt-4 space-y-3" id="app"></div>

    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-2xl">
            <h2 id="modal-title" class="text-xl font-bold text-white mb-4 italic">登記差假細節</h2>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block text-slate-400 mb-1">開始時間</label>
                    <input type="datetime-local" id="start-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">預計歸營時間</label>
                    <input type="datetime-local" id="end-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">職務代理人</label>
                    <select id="deputy" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                        <option value="無">無</option>
                        </select>
                </div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeModal()" class="flex-1 bg-slate-700 py-2 rounded-xl font-bold">取消</button>
                <button onclick="saveModal()" class="flex-1 bg-indigo-600 py-2 rounded-xl font-bold">確定儲存</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBSQnV0F2XFXhlca57uB653lNp99WJ1Asg",
          authDomain: "cat-shelter-49c2e.firebaseapp.com",
          databaseURL: "https://cat-shelter-49c2e-default-rtdb.firebaseio.com",
          projectId: "cat-shelter-49c2e",
          storageBucket: "cat-shelter-49c2e.firebasestorage.app",
          messagingSenderId: "325127819712",
          appId: "1:325127819712:web:28650c1e975de03fedb825",
          measurementId: "G-STQT6CZRHS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const memberRef = db.ref('personnel_data');

        const statuses = ['正常', '開船', '駐艇', '值更', '碼巡', '洽公', '幫廚', '補眠', '外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假', '空員'];
        const leftTeam = ['03', '05', '07', '09', '11', '13', '15', '17'];
        const rightTeam = ['04', '06', '08', '10', '12', '14', '16'];
        const eatStatuses = ['正常', '開船', '駐艇', '值更', '碼巡', '洽公', '幫廚', '補眠'];

        let memberStates = {};
        let currentEditingId = null;
        let currentEditingStatus = null;

        // 初始化日期與輪班判定 (5/5 為右班放假)
        function checkDuty() {
            const today = new Date();
            const baseDate = new Date(2026, 4, 5); // 5/5
            const diffDays = Math.floor((today - baseDate) / (1000 * 60 * 60 * 24));
            // 5/5(diff 0) 右班放假 -> 左班當值
            const isLeftDuty = (diffDays % 2 === 0);
            document.getElementById('today-duty').textContent = isLeftDuty ? "📅 今日當值班別：左班 (右班放假)" : "📅 今日當值班別：右班 (左班放假)";
        }

        function initApp() {
            const app = document.getElementById('app');
            const deputySelect = document.getElementById('deputy');
            const allIds = [...leftTeam, ...rightTeam].sort();
            
            allIds.forEach(id => {
                // 產生職代選單
                const opt = document.createElement('option');
                opt.value = id; opt.textContent = id;
                deputySelect.appendChild(opt);

                const team = leftTeam.includes(id) ? '左班' : '右班';
                const card = document.createElement('div');
                card.id = `card-${id}`;
                card.className = "bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 flex items-center justify-center rounded bg-slate-900 text-slate-400 font-mono text-xs font-bold">${id}</span>
                            <span class="text-[10px] text-slate-500 font-bold">${team}</span>
                            <span id="tag-${id}" class="px-2 py-0.5 rounded text-[9px] font-bold bg-正常">載入中...</span>
                        </div>
                        <div id="detail-${id}" class="text-[9px] text-amber-500 font-bold"></div>
                    </div>
                    <div class="grid grid-cols-4 gap-1">
                        ${statuses.map(s => `<button onclick="handleStatusClick('${id}', '${s}')" id="btn-${id}-${s}" class="status-btn py-2 rounded-md text-[9px] bg-slate-900/40 text-slate-400">${s}</button>`).join('')}
                    </div>`;
                app.appendChild(card);
            });
            checkDuty();
        }

        function handleStatusClick(id, s) {
            const needDetail = ['輪休', '慰休', '喪假', '事假', '病假'];
            if (needDetail.includes(s)) {
                currentEditingId = id;
                currentEditingStatus = s;
                document.getElementById('modal-title').textContent = `${id} 號 - ${s}登記`;
                document.getElementById('modal').style.display = 'flex';
            } else {
                memberRef.child(id).set({ status: s, start: '', end: '', deputy: '' });
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveModal() {
            const start = document.getElementById('start-time').value;
            const end = document.getElementById('end-time').value;
            const deputy = document.getElementById('deputy').value;
            memberRef.child(currentEditingId).set({
                status: currentEditingStatus,
                start: start,
                end: end,
                deputy: deputy
            });
            closeModal();
        }

        memberRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                memberStates = data;
                Object.keys(memberStates).forEach(id => updateUI(id, memberStates[id]));
                calculate();
            }
        });

        function updateUI(id, data) {
            const s = data.status;
            const tag = document.getElementById(`tag-${id}`);
            const detail = document.getElementById(`detail-${id}`);
            if(!tag) return;

            tag.textContent = s;
            tag.className = `px-2 py-0.5 rounded text-[9px] font-bold bg-${s}`;
            detail.textContent = data.end ? `迄: ${data.end.split('T')[0].slice(5)} ${data.end.split('T')[1]} (代:${data.deputy})` : "";

            document.querySelectorAll(`[id^="btn-${id}-"]`).forEach(b => b.classList.remove('active-status'));
            const btn = document.getElementById(`btn-${id}-${s}`);
            if(btn) btn.classList.add('active-status');
        }

        function calculate() {
            let leftTotal = 0, rightTotal = 0;
            Object.keys(memberStates).forEach(id => {
                if (eatStatuses.includes(memberStates[id].status)) {
                    if (leftTeam.includes(id)) leftTotal++;
                    if (rightTeam.includes(id)) rightTotal++;
                }
            });
            document.getElementById('meal-count').textContent = leftTotal + rightTotal;
            document.getElementById('left-meal').textContent = leftTotal;
            document.getElementById('right-meal').textContent = rightTotal;
        }

        function copyReport() {
            const reportCategories = ['外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假'];
            let reportText = "61艇人員動態回報\n";
            reportCategories.forEach(s => {
                const filtered = Object.keys(memberStates).filter(id => memberStates[id].status === s);
                if (filtered.length > 0) reportText += `${s}：${filtered.join('、')}\n`;
            });
            navigator.clipboard.writeText(reportText).then(() => alert("回報文字已複製！"));
        }

        window.onload = initApp;
    </script>
</body>
</html>
