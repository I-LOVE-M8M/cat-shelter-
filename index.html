<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>131 艦隊 - 精準伙食與動態管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: white; }
        .status-btn { transition: all 0.1s; border: 1px solid rgba(255,255,255,0.05); }
        .active-status { border: 2px solid #fbbf24 !important; background-color: #fbbf24 !important; color: #000 !important; font-weight: bold; }
        .bg-正常, .bg-開船, .bg-駐艇, .bg-值更, .bg-碼巡, .bg-洽公, .bg-幫廚, .bg-補眠 { background-color: #1e293b; border: 1px solid #334155; }
        .bg-外宿 { background-color: #a855f7; }
        .bg-放假班 { background-color: #f59e0b; }
        .bg-輪休, .bg-慰休, .bg-喪假, .bg-事假, .bg-病假 { background-color: #ef4444; }
        .bg-空員 { background-color: #334155; opacity: 0.5; }
        #modal { display: none; background: rgba(0,0,0,0.8); }
        .pre-leave-active { background-color: #f43f5e !important; border: 2px solid #fb7185 !important; color: white !important; }
    </style>
</head>
<body class="min-h-screen pb-32">

    <div class="max-w-4xl mx-auto px-3 pt-6 sticky top-0 z-40">
        <div class="bg-slate-800 rounded-3xl p-4 shadow-2xl border border-slate-700 flex justify-between items-center">
            <div>
                <h1 id="today-duty" class="text-amber-400 text-[10px] font-bold italic tracking-wider">載入中...</h1>
                <div class="text-sm font-bold text-slate-300">131艦隊 伙食動態系統</div>
            </div>
            <div class="flex gap-2">
                <button onclick="copyMealReport()" class="bg-blue-600 hover:bg-blue-500 text-[10px] px-3 py-2 rounded-lg font-bold shadow-lg">📋 複製伙食</button>
                <button onclick="copyStatusReport()" class="bg-emerald-600 hover:bg-emerald-500 text-[10px] px-3 py-2 rounded-lg font-bold shadow-lg">📋 複製動態</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-3 mt-4 space-y-3" id="app"></div>

    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-2xl">
            <h2 id="modal-title" class="text-xl font-bold text-white mb-2 italic">設定</h2>
            <div class="space-y-4 text-sm mt-4">
                <div>
                    <label id="start-label" class="block text-slate-400 mb-1">放假時間 (預設 17:00)</label>
                    <input type="datetime-local" id="start-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                </div>
                <div>
                    <label id="end-label" class="block text-slate-400 mb-1">收假時間 (預設 17:00)</label>
                    <input type="datetime-local" id="end-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                </div>
                <div id="deputy-box">
                    <label class="block text-slate-400 mb-1">職務代理人</label>
                    <select id="deputy" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"><option value="無">無</option></select>
                </div>
            </div>
            <div class="flex flex-col gap-2 mt-6">
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="flex-1 bg-slate-700 py-2 rounded-xl font-bold text-xs">取消</button>
                    <button onclick="saveModal()" class="flex-1 bg-indigo-600 py-2 rounded-xl font-bold text-xs">儲存設定</button>
                </div>
                <button id="cancel-btn" onclick="clearData()" class="w-full bg-rose-900/40 text-rose-300 py-2 rounded-xl font-bold text-[10px] border border-rose-800">清除設定 (恢復正常)</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBSQnV0F2XFXhlca57uB653lNp99WJ1Asg",
          authDomain: "cat-shelter-49c2e.firebaseapp.com",
          databaseURL: "https://cat-shelter-49c2e-default-rtdb.firebaseio.com",
          projectId: "cat-shelter-49c2e",
          storageBucket: "cat-shelter-49c2e.firebasestorage.app",
          messagingSenderId: "325127819712",
          appId: "1:325127819712:web:28650c1e975de03fedb825",
          measurementId: "G-STQT6CZRHS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const memberRef = db.ref('personnel_data');

        const statuses = ['正常', '開船', '駐艇', '值更', '碼巡', '洽公', '幫廚', '補眠', '外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假', '空員'];
        const leftTeam = ['04', '05', '06', '10', '12', '15', '16'];
        const rightTeam = ['03', '07', '08', '09', '11', '13', '14', '17'];
        
        let memberStates = {};
        let currentEditingId = null;
        let mode = ""; 

        function initApp() {
            const app = document.getElementById('app');
            const deputySelect = document.getElementById('deputy');
            const allIds = [...leftTeam, ...rightTeam].sort((a,b) => parseInt(a) - parseInt(b));
            
            allIds.forEach(id => {
                const opt = document.createElement('option'); opt.value = id; opt.textContent = id;
                deputySelect.appendChild(opt);
                const team = leftTeam.includes(id) ? '左班' : '右班';
                const card = document.createElement('div');
                card.id = `card-${id}`;
                card.className = "bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 flex items-center justify-center rounded bg-slate-900 text-slate-400 font-mono text-xs font-bold">${id}</span>
                            <span class="text-[9px] text-slate-500 font-bold">${team}</span>
                            <span id="tag-${id}" class="px-2 py-0.5 rounded text-[9px] font-bold bg-正常">...</span>
                        </div>
                        <button id="pre-${id}" onclick="openModal('${id}', 'pre')" class="text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500">預放</button>
                    </div>
                    <div id="detail-${id}" class="text-[8px] text-amber-500 font-bold mb-2 px-1 min-h-[12px]"></div>
                    <div class="grid grid-cols-4 gap-1">
                        ${statuses.map(s => `<button onclick="handleStatusClick('${id}', '${s}')" id="btn-${id}-${s}" class="status-btn py-2 rounded-md text-[9px] bg-slate-900/40 text-slate-400">${s}</button>`).join('')}
                    </div>`;
                app.appendChild(card);
            });
            updateDuty();
        }

        function updateDuty() {
            const today = new Date();
            const baseDate = new Date(2026, 4, 5); 
            const diffDays = Math.floor((today - baseDate) / (1000 * 60 * 60 * 24));
            document.getElementById('today-duty').textContent = (diffDays % 2 === 0) ? "📅 今日當值：左班" : "📅 今日當值：右班";
        }

        function openModal(id, m) {
            currentEditingId = id; mode = m;
            const now = new Date().toISOString().split('T')[0];
            document.getElementById('start-time').value = `${now}T17:00`;
            document.getElementById('end-time').value = `${now}T17:00`;
            
            if (mode === 'pre') {
                document.getElementById('modal-title').textContent = `${id} 號 預放區間設定`;
                document.getElementById('deputy-box').classList.add('hidden');
            } else {
                document.getElementById('modal-title').textContent = `${id} 號 差假登記`;
                document.getElementById('deputy-box').classList.remove('hidden');
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function clearData() {
            memberRef.child(currentEditingId).update({ preLeave: false, start: '', end: '', deputy: '' });
            closeModal();
        }

        function handleStatusClick(id, s) {
            const needDetail = ['輪休', '慰休', '喪假', '事假', '病假'];
            if (needDetail.includes(s)) {
                openModal(id, 'leave');
                currentEditingStatus = s;
            } else {
                memberRef.child(id).update({ status: s, start: '', end: '', deputy: '', preLeave: false });
            }
        }

        function saveModal() {
            const start = document.getElementById('start-time').value;
            const end = document.getElementById('end-time').value;
            const deputy = document.getElementById('deputy').value;

            if (mode === 'pre') {
                memberRef.child(currentEditingId).update({ preLeave: true, start, end });
            } else {
                memberRef.child(currentEditingId).update({ status: currentEditingStatus, start, end, deputy, preLeave: false });
            }
            closeModal();
        }

        memberRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                memberStates = data;
                Object.keys(memberStates).forEach(id => {
                    const d = memberStates[id];
                    const tag = document.getElementById(`tag-${id}`);
                    const detail = document.getElementById(`detail-${id}`);
                    const preBtn = document.getElementById(`pre-${id}`);
                    if(!tag) return;

                    tag.textContent = d.status;
                    tag.className = `px-2 py-0.5 rounded text-[9px] font-bold bg-${d.status}`;
                    
                    let info = "";
                    if (d.preLeave) {
                        info = `[預放: ${d.start.slice(5,16).replace('T',' ')} ~ ${d.end.slice(5,16).replace('T',' ')}]`;
                        preBtn.className = "text-[9px] px-2 py-1 rounded pre-leave-active font-bold";
                    } else {
                        if(d.end) info = `迄: ${d.end.slice(5,16).replace('T',' ')} (代:${d.deputy})`;
                        preBtn.className = "text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500";
                    }
                    detail.textContent = info;

                    document.querySelectorAll(`[id^="btn-${id}-"]`).forEach(b => b.classList.remove('active-status'));
                    const btn = document.getElementById(`btn-${id}-${d.status}`);
                    if(btn) btn.classList.add('active-status');
                });
            }
        });

        function copyMealReport() {
            const allIds = [...leftTeam, ...rightTeam].sort((a,b) => parseInt(a) - parseInt(b));
            const getEaters = (targetTimeStr) => {
                const target = new Date(targetTimeStr).getTime();
                return allIds.filter(id => {
                    const d = memberStates[id];
                    if (!d || d.status === '空員') return false;
                    
                    // 只要有填時間 (不管是假單還是預放)，邏輯一致
                    if (d.start && d.end) {
                        const s = new Date(d.start).getTime();
                        const e = new Date(d.end).getTime();
                        // 如果現在時間在放假區間內，且還沒收假，就不吃
                        // 但如果是收假當餐 (等於 e)，就要吃
                        if (target > s && target < e) return false;
                        if (target >= e) return true; // 收假了，吃
                        if (target <= s) return true; // 還沒走，吃
                    }
                    return true;
                }).join('、');
            };

            const report = `61艇伙食統計\n\n` +
                `週六早餐：${getEaters('2026-05-09T07:00')}\n` +
                `週六中餐：${getEaters('2026-05-09T11:00')}\n` +
                `週六晚餐：${getEaters('2026-05-09T17:00')}\n` +
                `週日早餐：${getEaters('2026-05-10T07:00')}\n` +
                `週日中餐：${getEaters('2026-05-10T11:00')}\n` +
                `週日晚餐：${getEaters('2026-05-10T17:00')}\n` +
                `週一早餐：${getEaters('2026-05-11T07:00')}`;
            
            navigator.clipboard.writeText(report).then(() => alert("伙食名單已複製！"));
        }

        function copyStatusReport() {
            let text = "61艇動態回報\n";
            ['外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假'].forEach(s => {
                const f = Object.keys(memberStates).filter(id => memberStates[id].status === s).sort();
                if (f.length > 0) text += `${s}：${f.join('、')}\n`;
            });
            const pre = Object.keys(memberStates).filter(id => memberStates[id].preLeave).sort();
            if (pre.length > 0) text += `預放：${pre.join('、')}\n`;
            navigator.clipboard.writeText(text).then(() => alert("動態已複製"));
        }

        window.onload = initApp;
    </script>
</body>
</html>
