<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧伙食與動態管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .status-btn { transition: all 0.1s; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .active-status { border: 2px solid #fbbf24 !important; background-color: #fbbf24 !important; color: #000 !important; font-weight: bold; }
        .bg-正常, .bg-開船, .bg-駐艇, .bg-值更, .bg-碼巡, .bg-洽公, .bg-幫廚, .bg-補眠 { background-color: #1e293b; border: 1px solid #334155; }
        .bg-外宿, .bg-放假班 { background-color: #f59e0b; }
        .bg-輪休, .bg-慰休, .bg-喪假, .bg-事假, .bg-病假 { background-color: #ef4444; }
        .bg-受訓 { background-color: #3b82f6; }
        .bg-公假 { background-color: #a855f7; }
        .bg-空員 { background-color: #334155; opacity: 0.5; }
        #modal { display: none; background: rgba(0,0,0,0.9); }
        .pre-leave-active { background-color: #f43f5e !important; border: 2px solid #fb7185 !important; color: white !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-32 text-xs sm:text-sm">

    <div class="max-w-4xl mx-auto px-3 pt-6 sticky top-0 z-40">
        <div class="bg-slate-800 rounded-3xl p-4 shadow-2xl border border-slate-700 flex flex-col gap-3">
            <div class="flex justify-between items-start px-2">
                <div class="space-y-1">
                    <h1 id="today-duty" class="text-amber-400 text-[10px] font-bold italic tracking-wider uppercase">載入中...</h1>
                    <div class="flex items-center gap-2">
                        <div class="text-[9px] text-slate-400 font-bold flex items-center gap-1">🌇 日落：<span id="sunset-time" class="text-rose-400">讀取中</span></div>
                        <a href="https://www.cwa.gov.tw/V8/C/M/tide.html?NSeaID=NSea06" target="_blank" class="text-[8px] bg-slate-700 px-2 py-0.5 rounded text-slate-300 border border-slate-600">⚓ 高雄港潮汐表</a>
                    </div>
                    <div class="text-[11px] font-bold text-slate-300 italic pt-1">PERSONNEL & MEAL OPS</div>
                </div>
                
                <div class="flex gap-1.5 items-center">
                    <select id="week-select" class="bg-slate-700 text-[10px] px-1.5 py-2 rounded-lg font-bold border border-slate-600 text-amber-400 outline-none cursor-pointer">
                        <option value="this">本週伙食</option>
                        <option value="next">下週伙食 ➔</option>
                    </select>
                    <button onclick="openBatchModal()" class="bg-purple-600 text-[10px] px-2 py-2 rounded-lg font-bold shadow-lg">⚡ 批次預放</button>
                    <button onclick="copyMealReport()" class="bg-blue-600 text-[10px] px-2 py-2 rounded-lg font-bold shadow-lg">📋 伙食</button>
                    <button onclick="copyStatusReport()" class="bg-emerald-600 text-[10px] px-2 py-2 rounded-lg font-bold shadow-lg">📋 動態</button>
                </div>
            </div>
            <div id="top-pre-leave-board" class="bg-slate-900/50 rounded-2xl p-3 border border-amber-500/30 mx-1">
                <div class="text-[10px] text-amber-500 font-bold mb-1">預放人員看板</div>
                <div id="pre-leave-list" class="text-[9px] text-slate-400 space-y-1">載入中...</div>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-3 mt-4 space-y-3" id="app"></div>
    <div class="max-w-4xl mx-auto px-3 mt-6 pb-10 text-[10px]" id="stat-board"></div>

    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-2xl text-sm">
            <h2 id="modal-title" class="text-xl font-bold text-white mb-4 text-center">詳情設定</h2>
            <div class="space-y-4">
                <div id="pre-status-container" class="hidden">
                    <label class="block text-slate-400 mb-1">預放種類</label>
                    <select id="pre-status-select" onchange="toggleReasonField()" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none">
                        <option value="輪休">輪休</option><option value="預放">預放</option><option value="慰休">慰休</option><option value="受訓">受訓</option><option value="公假">公假</option><option value="喪假">喪假</option><option value="事假">事假</option><option value="病假">病假</option>
                    </select>
                </div>
                <div id="reason-container">
                    <label class="block text-slate-400 mb-1">原因 (輪/慰休免填)</label>
                    <input type="text" id="leave-reason" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none" placeholder="例如：回診、支援...">
                </div>
                <div><label class="block text-slate-400 mb-1">開始/離營時間</label><input type="datetime-local" id="start-time" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none"></div>
                <div><label class="block text-slate-400 mb-1">結束/歸營時間</label><input type="datetime-local" id="end-time" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none"></div>
                
                <div>
                    <label class="block text-slate-400 mb-1">職務代理人 (可複選)</label>
                    <div id="deputy-container" class="w-full bg-slate-900 rounded-lg p-2 max-h-24 overflow-y-auto no-scrollbar flex flex-wrap gap-1.5 border border-slate-700">
                        <!-- 選項由JS產生 -->
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col gap-2 mt-6">
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="flex-1 bg-slate-700 py-2 rounded-xl font-bold active:scale-95 transition-all">取消</button>
                    <button onclick="saveModal()" class="flex-1 bg-indigo-600 py-2 rounded-xl font-bold active:scale-95 transition-all">儲存</button>
                </div>
                <button onclick="clearSpecificData()" class="w-full bg-rose-900/40 text-rose-300 py-2 rounded-xl font-bold text-[10px] border border-rose-800 active:scale-95 transition-all">❌ 清除紀錄 (含批次選取)</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBSQnV0F2XFXhlca57uB653lNp99WJ1Asg",
          authDomain: "cat-shelter-49c2e.firebaseapp.com",
          databaseURL: "https://cat-shelter-49c2e-default-rtdb.firebaseio.com",
          projectId: "cat-shelter-49c2e",
          storageBucket: "cat-shelter-49c2e.firebasestorage.app",
          messagingSenderId: "325127819712",
          appId: "1:325127819712:web:28650c1e975de03fedb825",
          measurementId: "G-STQT6CZRHS"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), memberRef = db.ref('personnel_v2');
        const leftTeam = ['04', '05', '06', '10', '12', '15', '16'], rightTeam = ['03', '07', '08', '09', '11', '13', '14', '17'];
        const allIds = [...leftTeam, ...rightTeam].sort((a,b) => parseInt(a) - parseInt(b));
        const statuses = ['正常', '開船', '駐艇', '值更', '碼巡', '洽公', '幫廚', '補眠', '外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假', '受訓', '公假', '空員'];
        let memberStates = {}, currentEditingId = null, editMode = ""; 
        let selectedBatchIds = [];

        async function fetchSunset() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=22.70&longitude=120.27&daily=sunset&timezone=Asia%2FTaipei`);
                const data = await res.json();
                if (data?.daily?.sunset) document.getElementById('sunset-time').textContent = data.daily.sunset[0].split('T')[1];
            } catch (e) { document.getElementById('sunset-time').textContent = "手動查詢"; }
        }

        function parseToTime(str) {
            if (!str) return 0;
            return new Date(str.replace(/-/g, '/').replace('T', ' ')).getTime();
        }

        // 智慧時間轉換 (時間到自動變真放假、歸營自動變正常)
        function smartSyncPersonnel(states) {
            const now = new Date().getTime();
            Object.keys(states).forEach(id => {
                const d = states[id]; if (!d) return;
                const preStartT = parseToTime(d.preStart);
                const mainEndT = parseToTime(d.end);
                
                // 預防時間到了 -> 自動轉成真正的放假 (輪休等)
                if (d.preLeave && preStartT > 0 && now >= preStartT) {
                    memberRef.child(id).update({ 
                        status: d.preStatus || '輪休', 
                        start: d.preStart, 
                        end: d.preEnd, 
                        deputy: d.preDeputy || '', 
                        reason: d.preReason || '', 
                        preLeave: false, preStart: '', preEnd: '', preDeputy: '', preStatus: '', preReason: '' 
                    });
                } 
                // 歸營時間到了 -> 自動跳回正常
                else if (d.status !== '正常' && d.status !== '空員' && mainEndT > 0 && now >= mainEndT) {
                    memberRef.child(id).update({ 
                        status: '正常', start: '', end: '', deputy: '', reason: '' 
                    });
                }
            });
        }

        // 設定每 30 秒自動檢查一次時間，觸發自動轉換
        setInterval(() => {
            if(Object.keys(memberStates).length > 0) {
                smartSyncPersonnel(memberStates);
            }
        }, 30000); 

        function clearSpecificData() {
            if (editMode === 'batch') {
                selectedBatchIds.forEach(id => {
                    memberRef.child(id).update({ preLeave: false, preStart: '', preEnd: '', preDeputy: '', preStatus: '', preReason: '' });
                });
                document.querySelectorAll('.batch-checkbox:checked').forEach(cb => cb.checked = false);
            } else {
                if (!currentEditingId) return;
                const up = editMode === 'pre' ? 
                    { preLeave: false, preStart: '', preEnd: '', preDeputy: '', preStatus: '', preReason: '' } : 
                    { start: '', end: '', deputy: '', reason: '' };
                memberRef.child(currentEditingId).update(up);
            }
            closeModal();
        }

        // 修復：正確判斷左右班，修正之前導致全部判斷為左班的錯誤
        function getDutyByDate(dateStr) {
            const base = new Date('2026/05/05 00:00:00'), target = new Date(dateStr.split('T')[0].replace(/-/g, '/') + ' 00:00:00');
            return (Math.abs(Math.round((target - base) / 86400000)) % 2 === 0) ? "左" : "右";
        }

        function toggleReasonField() {
            const currentStatus = (editMode === 'pre' || editMode === 'batch') ? document.getElementById('pre-status-select').value : (memberStates[currentEditingId]?.status || '正常');
            document.getElementById('reason-container').style.display = (currentStatus === '輪休' || currentStatus === '慰休') ? 'none' : 'block';
        }

        function getTargetDates() {
            let today = new Date();
            let day = today.getDay(); 
            let sat = new Date(today);
            if (day === 0) sat.setDate(today.getDate() - 1); 
            else if (day === 1) sat.setDate(today.getDate() - 2); 
            else sat.setDate(today.getDate() + (6 - day)); 
            
            const weekType = document.getElementById('week-select').value;
            if (weekType === 'next') { sat.setDate(sat.getDate() + 7); }
            
            let sun = new Date(sat); sun.setDate(sat.getDate() + 1);
            let mon = new Date(sat); mon.setDate(sat.getDate() + 2);
            return { sat: sat.toISOString().split('T')[0], sun: sun.toISOString().split('T')[0], mon: mon.toISOString().split('T')[0] };
        }

        function initApp() {
            const app = document.getElementById('app');
            const deputyContainer = document.getElementById('deputy-container');
            
            app.innerHTML = ""; 
            deputyContainer.innerHTML = "";

            allIds.forEach(id => {
                deputyContainer.innerHTML += `
                    <label class="flex items-center gap-1.5 text-slate-300 text-[11px] bg-slate-800 px-2 py-1.5 rounded-lg cursor-pointer border border-slate-700 hover:bg-slate-700 transition-colors">
                        <input type="checkbox" value="${id}" class="deputy-checkbox accent-indigo-500 w-3.5 h-3.5"> 
                        <span class="font-mono font-bold">${id}</span>
                    </label>
                `;

                const card = document.createElement('div'); card.id = `card-${id}`;
                card.className = "bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50";
                card.innerHTML = `<div class="flex justify-between items-center mb-2 px-1"><div class="flex items-center gap-1.5"><input type="checkbox" id="chk-${id}" value="${id}" class="batch-checkbox w-3.5 h-3.5 accent-amber-500 rounded cursor-pointer"><span class="w-6 h-6 flex items-center justify-center rounded bg-slate-900 text-slate-400 font-mono text-xs font-bold">${id}</span><span id="tag-${id}" class="px-2 py-0.5 rounded text-[9px] font-bold bg-正常 text-white">正常</span></div><button id="pre-${id}" onclick="openConfigModal('${id}', 'pre')" class="text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500">預放</button></div><div id="detail-${id}" class="text-[8px] text-amber-400 font-bold mb-2 px-1 min-h-[14px] leading-tight"></div><div class="grid grid-cols-4 gap-1">${statuses.map(s => `<button onclick="handleStatusClick('${id}', '${s}')" id="btn-${id}-${s}" class="status-btn py-2 rounded-md text-[9px] bg-slate-900/40 text-slate-400">${s}</button>`).join('')}</div>`;
                app.appendChild(card);
            });
            document.getElementById('today-duty').textContent = `📅 今日當值：${getDutyByDate(new Date().toISOString().split('T')[0])}班`;
            fetchSunset();
        }

        function setDeputyCheckboxes(deputyString) {
            const deputies = deputyString ? deputyString.split(',') : [];
            document.querySelectorAll('.deputy-checkbox').forEach(cb => {
                cb.checked = deputies.includes(cb.value);
            });
        }

        function getSelectedDeputies() {
            return Array.from(document.querySelectorAll('.deputy-checkbox:checked')).map(cb => cb.value).join(',');
        }

        function openBatchModal() {
            const checkboxes = document.querySelectorAll('.batch-checkbox:checked');
            selectedBatchIds = Array.from(checkboxes).map(cb => cb.value);
            
            if (selectedBatchIds.length === 0) {
                alert("請先在名單上勾選要批次預放的人員！");
                return;
            }
            
            editMode = 'batch';
            const nowDay = new Date().toISOString().split('T')[0];
            
            document.getElementById('pre-status-container').className = "block";
            document.getElementById('start-time').value = `${nowDay}T07:00`;
            document.getElementById('end-time').value = `${nowDay}T07:00`;
            document.getElementById('pre-status-select').value = "輪休";
            document.getElementById('leave-reason').value = "";
            setDeputyCheckboxes(""); 
            toggleReasonField();
            
            document.getElementById('modal-title').textContent = `批次設定 (${selectedBatchIds.join(', ')})`;
            document.getElementById('modal').style.display = 'flex';
        }

        function openConfigModal(id, m) {
            currentEditingId = id.toString(); editMode = m; const d = memberStates[id] || {};
            const nowDay = new Date().toISOString().split('T')[0];
            document.getElementById('pre-status-container').className = (m === 'pre' ? "block" : "hidden");
            document.getElementById('start-time').value = (m==='pre' ? d.preStart : d.start) || `${nowDay}T07:00`;
            document.getElementById('end-time').value = (m==='pre' ? d.preEnd : d.end) || `${nowDay}T07:00`;
            document.getElementById('pre-status-select').value = d.preStatus || "輪休";
            document.getElementById('leave-reason').value = (m==='pre' ? d.preReason : d.reason) || "";
            
            setDeputyCheckboxes((m === 'pre' ? d.preDeputy : d.deputy) || "");
            
            toggleReasonField();
            document.getElementById('modal-title').textContent = (m === 'pre' ? `預放設定 - ${id}號` : `詳情設定 - ${id}號`);
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function handleStatusClick(id, s) {
            memberRef.child(id).update({ status: s });
            if (['輪休', '慰休', '喪假', '事假', '病假', '受訓', '公假'].includes(s)) openConfigModal(id, 'leave');
        }

        function saveModal() {
            const s = document.getElementById('start-time').value;
            const e = document.getElementById('end-time').value;
            const d = getSelectedDeputies(); 
            const ps = document.getElementById('pre-status-select').value;
            const r = document.getElementById('leave-reason').value;

            if (editMode === 'batch') {
                selectedBatchIds.forEach(id => {
                    memberRef.child(id).update({ preLeave: true, preStart: s, preEnd: e, preDeputy: d, preStatus: ps, preReason: r });
                });
                document.querySelectorAll('.batch-checkbox:checked').forEach(cb => cb.checked = false);
            } else {
                const up = editMode === 'pre' ? { preLeave: true, preStart: s, preEnd: e, preDeputy: d, preStatus: ps, preReason: r } : { start: s, end: e, deputy: d, reason: r };
                memberRef.child(currentEditingId).update(up); 
            }
            closeModal();
        }

        memberRef.on('value', (sn) => {
            memberStates = sn.val() || {};
            smartSyncPersonnel(memberStates);

            const preLeaveList = document.getElementById('pre-leave-list');
            const preLeavers = allIds.filter(id => memberStates[id]?.preLeave);
            if (preLeavers.length > 0) {
                preLeaveList.innerHTML = preLeavers.map(id => {
                    const d = memberStates[id];
                    const pStart = d.preStart || '';
                    const pEnd = d.preEnd || '';
                    // 修改：上方預放名單也會顯示職代
                    const pDep = d.preDeputy ? ` <span class="text-indigo-400 font-bold ml-1">代:${d.preDeputy}</span>` : '';
                    return `<div class="bg-slate-800/50 p-1.5 rounded-lg border-l-2 border-amber-500 flex justify-between items-center"><span class="text-white font-bold">${id} <span class="text-amber-500">(${d.preStatus || '預放'})</span></span><span class="text-slate-400 font-mono text-[8px]">${pStart.slice(5,16).replace('T',' ')} ~ ${pEnd.slice(5,16).replace('T',' ')}${pDep}</span></div>`;
                }).join('');
            } else preLeaveList.innerHTML = `<div class="text-slate-500 italic text-[10px]">目前無預放人員</div>`;

            allIds.forEach(id => {
                const d = memberStates[id]; if(!d) return;
                document.getElementById(`tag-${id}`).textContent = d.status;
                document.getElementById(`tag-${id}`).className = `px-2 py-0.5 rounded text-[9px] font-bold bg-${d.status} text-white`;
                
                // 修改：詳細資訊字串拼接，顯示職代或預放職代
                let info = "";
                if(d.start && d.end) {
                    info += `[時:${d.start.slice(5,16).replace('T',' ')} ~ ${d.end.slice(5,16).replace('T',' ')}]`;
                    if (d.deputy) info += ` <span class="text-indigo-400">代:${d.deputy}</span>`;
                }
                if(d.preLeave && d.preStart) {
                    if(info) info += "<br>"; // 換行避免擠在一起
                    info += `[預:${d.preStart.slice(5,16).replace('T',' ')} ~ ${d.preEnd.slice(5,16).replace('T',' ')}]`;
                    if (d.preDeputy) info += ` <span class="text-indigo-400">預代:${d.preDeputy}</span>`;
                }
                document.getElementById(`detail-${id}`).innerHTML = info;

                document.getElementById(`pre-${id}`).className = d.preLeave ? "text-[9px] px-2 py-1 rounded pre-leave-active font-bold" : "text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500";
                document.querySelectorAll(`[id^="btn-${id}-"]`).forEach(b => b.classList.remove('active-status'));
                const btn = document.getElementById(`btn-${id}-${d.status}`); if(btn) btn.classList.add('active-status');
            });
            
            const board = document.getElementById('stat-board'); board.innerHTML = "";
            statuses.forEach(s => {
                const f = allIds.filter(id => memberStates[id]?.status === s);
                if(f.length>0) board.innerHTML += `<div class="bg-slate-800 p-2 rounded-lg mb-1 flex justify-between"><span>${s}</span><span class="text-amber-500 font-bold">${f.join(',')}</span></div>`;
            });
        });

        function copyMealReport() {
            try {
                const dates = getTargetDates();
                const times = [
                    {n: "週六早餐", t: `${dates.sat}T07:00`, m: "早"}, {n: "週六中餐", t: `${dates.sat}T11:00`, m: "中"}, {n: "週六晚餐", t: `${dates.sat}T17:00`, m: "晚"},
                    {n: "週日早餐", t: `${dates.sun}T07:00`, m: "早"}, {n: "週日中餐", t: `${dates.sun}T11:00`, m: "中"}, {n: "週日晚餐", t: `${dates.sun}T17:00`, m: "晚"},
                    {n: "週一早餐", t: `${dates.mon}T07:00`, m: "早"}
                ];
                let reportText = "61艇伙食統計表\n\n";
                times.forEach(tm => {
                    const targetT = parseToTime(tm.t), dutyTeam = getDutyByDate(tm.t);
                    const eaters = allIds.filter(id => {
                        const d = memberStates[id]; if(!d || d.status === '空員') return false;
                        
                        // 檢查自己有沒有掛著別人的職代 (有的話一定要吃)
                        const isDeputyNow = allIds.some(oid => {
                            const od = memberStates[oid]; if(!od) return false;
                            const depStr = od.deputy || "";
                            const preDepStr = od.preDeputy || "";
                            
                            // 檢查正常假別的職代
                            if (od.start && od.end && depStr.includes(id)) {
                                if (targetT >= parseToTime(od.start) && targetT < parseToTime(od.end)) return true;
                            }
                            // 檢查預放假別的職代
                            if (od.preLeave && od.preStart && od.preEnd && preDepStr.includes(id)) {
                                if (targetT >= parseToTime(od.preStart) && targetT < parseToTime(od.preEnd)) return true;
                            }
                            return false;
                        });
                        if (isDeputyNow) return true;
                        
                        let selfOnLeave = false;
                        // 如果自己正在放假時間內
                        if (d.start && d.end && targetT >= parseToTime(d.start) && targetT < parseToTime(d.end)) selfOnLeave = true;
                        // 如果自己正在「預放」的時間內 (預放算真放假)
                        if (d.preLeave && d.preStart && d.preEnd && targetT >= parseToTime(d.preStart) && targetT < parseToTime(d.preEnd)) selfOnLeave = true;
                        
                        if (selfOnLeave) return false;
                        if (tm.m === '早') return true;
                        
                        // 依照正確的左右班判斷
                        return (leftTeam.includes(id) ? "左" : "右") === dutyTeam;
                    }).sort((a,b) => parseInt(a)-parseInt(b));
                    reportText += `${tm.n} (${eaters.length}員)：${eaters.join('、')}\n`;
                });
                navigator.clipboard.writeText(reportText).then(() => alert("伙食名單已複製！"));
            } catch (err) { alert("出錯：" + err.message); }
        }

        function copyStatusReport() {
            let text = "61艇人員動態回報\n";
            ['受訓', '公假', '外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假'].forEach(s => {
                const f = allIds.filter(id => memberStates[id]?.status === s);
                if (f.length > 0) text += `${s} (${f.length}員)：${f.join('、')}\n`;
            });
            navigator.clipboard.writeText(text).then(() => alert("動態已複製"));
        }
        window.onload = initApp;
    </script>
</body>
</html>
