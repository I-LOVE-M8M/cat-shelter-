        .status-btn { transition: all 0.1s; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .active-status { border: 2px solid #fbbf24 !important; background-color: #fbbf24 !important; color: #000 !important; font-weight: bold; }

        .bg-空員 { background-color: #334155; opacity: 0.5; }

                    <select id="pre-status-select" onchange="toggleReasonField()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">

                        <option value="預放">預放</option>

                <div><label class="block text-slate-400 mb-1 font-bold">開始/離營時間</label>

                <select id="deputy" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none"><option value="無">無</option></select></div>

            <div class="flex flex-col gap-2 mt-6">

                document.getElementById('low-tide').textContent = builtinTideTable[today].low;
                document.getElementById('high-tide').classList.remove('border-dashed', 'cursor-pointer', 'hover:bg-slate-700');
                document.getElementById('low-tide').classList.remove('border-dashed', 'cursor-pointer', 'hover:bg-slate-700');
                return;
            }

            // 如果遇到跨年或表裡沒有的日期，自動開啟雲端同步模式
            infoRef.on('value', snap => {
                const data = snap.val() || {};
                if(!builtinTideTable[today]) {
                    if (data.date === today) {
                        document.getElementById('high-tide').textContent = data.highTide || "點此更新";
                        document.getElementById('low-tide').textContent = data.lowTide || "點此更新";
                    } else {
                        document.getElementById('high-tide').textContent = "點此更新(無資料)";
                        document.getElementById('low-tide').textContent = "點此更新(無資料)";
                    }
                }
            });
        }

        function editTide() {
            const today = new Date().toISOString().split('T')[0];
            if (builtinTideTable[today]) {
                alert("今日潮汐已由內建氣象署資料自動載入，不需手動更新！");
                return;
            }

            const currentHigh = document.getElementById('high-tide').textContent;
            const currentLow = document.getElementById('low-tide').textContent;
            const h = prompt("請輸入今日【滿潮】時間 (例如 08:30, 20:15)：", currentHigh.includes('更新') ? "" : currentHigh);
            if (h === null) return; 
            const l = prompt("請輸入今日【乾潮】時間 (例如 14:20, 02:10)：", currentLow.includes('更新') ? "" : currentLow);
            if (l === null) return;

            infoRef.update({ highTide: h || "未輸入", lowTide: l || "未輸入", date: today });
        }

        function parseToTime(str) {
            if (!str) return 0;
            return new Date(str.replace(/-/g, '/').replace('T', ' ')).getTime();
        }

        function getDutyByDate(dateStr) {
            const base = new Date('2026/05/05 00:00:00');
            const target = new Date(dateStr.split('T')[0].replace(/-/g, '/') + ' 00:00:00');
            const diff = Math.round((target - base) / 86400000);
            return (Math.abs(diff) % 2 === 0) ? "左" : "右";
        }

        function toggleReasonField() {
            const currentStatus = (editMode === 'pre') ? document.getElementById('pre-status-select').value : memberStates[currentEditingId]?.status;
            const container = document.getElementById('reason-container');
            if (currentStatus === '輪休' || currentStatus === '慰休') container.style.display = 'none';
            else container.style.display = 'block';
        }

        function initApp() {
            const app = document.getElementById('app');
            const deputySelect = document.getElementById('deputy');
            allIds.forEach(id => {
                const opt = document.createElement('option'); opt.value = id; opt.textContent = id;
                deputySelect.appendChild(opt);
                const card = document.createElement('div');
                card.id = `card-${id}`;
                card.className = "bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50";
                card.innerHTML = `<div class="flex justify-between items-center mb-2 px-1"><div class="flex items-center gap-2"><span class="w-6 h-6 flex items-center justify-center rounded bg-slate-900 text-slate-400 font-mono text-xs font-bold">${id}</span><span id="tag-${id}" class="px-2 py-0.5 rounded text-[9px] font-bold bg-正常 text-white">正常</span></div><button id="pre-${id}" onclick="openConfigModal('${id}', 'pre')" class="text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500 transition-all active:scale-95">預放</button></div><div id="detail-${id}" class="text-[8px] text-amber-400 font-bold mb-2 px-1 min-h-[14px] leading-tight"></div><div class="grid grid-cols-4 gap-1">${statuses.map(s => `<button onclick="handleStatusClick('${id}', '${s}')" id="btn-${id}-${s}" class="status-btn py-2 rounded-md text-[9px] bg-slate-900/40 text-slate-400">${s}</button>`).join('')}</div>`;
                app.appendChild(card);
            });
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('today-duty').textContent = `📅 今日當值：${getDutyByDate(today)}班`;
            fetchAstroData();
            loadTideData(); 
        }

        function openConfigModal(id, m) {
            currentEditingId = id.toString(); editMode = m;
            const d = memberStates[currentEditingId] || {};
            const nowDay = new Date().toISOString().split('T')[0];
            document.getElementById('pre-status-container').className = (m === 'pre') ? "block" : "hidden";
            let defaultHour = (m !== 'pre' && d.status === '輪休') ? "17:00" : "07:00";
            document.getElementById('start-time').value = (m==='pre' ? d.preStart : d.start) || `${nowDay}T${defaultHour}`;
            document.getElementById('end-time').value = (m==='pre' ? d.preEnd : d.end) || `${nowDay}T${defaultHour}`;
            document.getElementById('deputy').value = (m==='pre' ? d.preDeputy : d.deputy) || "無";
            document.getElementById('pre-status-select').value = d.preStatus || "輪休";
            document.getElementById('leave-reason').value = (m==='pre' ? d.preReason : d.reason) || "";
            toggleReasonField();
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        function clearSpecificData() {
            const up = editMode === 'pre' ? { preLeave: false, preStart: '', preEnd: '', preDeputy: '', preStatus: '', preReason: '' } : { start: '', end: '', deputy: '', reason: '' };
            memberRef.child(currentEditingId).update(up);
            closeModal();
        }

        function handleStatusClick(id, s) {
            if (['輪休', '慰休', '喪假', '事假', '病假', '受訓', '公假'].includes(s)) {
                memberRef.child(id).update({ status: s });
                openConfigModal(id, 'leave');
            } else memberRef.child(id).update({ status: s });
        }

        function saveModal() {
            const s = document.getElementById('start-time').value, e = document.getElementById('end-time').value, d = document.getElementById('deputy').value, ps = document.getElementById('pre-status-select').value, reason = document.getElementById('leave-reason').value;
            const up = editMode === 'pre' ? { preLeave: true, preStart: s, preEnd: e, preDeputy: d, preStatus: ps, preReason: reason } : { start: s, end: e, deputy: d, reason: reason };
            memberRef.child(currentEditingId).update(up);
            closeModal();
        }

        function smartSyncPersonnel(states) {
            const now = new Date().getTime();
            Object.keys(states).forEach(id => {
                const d = states[id];
                const preStartT = parseToTime(d.preStart);
                const mainEndT = parseToTime(d.end);
                if (d.preLeave && preStartT > 0 && now >= preStartT) {
                    memberRef.child(id).update({ status: d.preStatus || '輪休', start: d.preStart, end: d.preEnd, deputy: d.preDeputy, reason: d.preReason || '', preLeave: false, preStart: '', preEnd: '', preDeputy: '', preStatus: '', preReason: '' });
                } else if (d.status !== '正常' && d.status !== '空員' && mainEndT > 0 && now >= mainEndT) {
                    memberRef.child(id).update({ status: '正常', start: '', end: '', deputy: '', reason: '', preLeave: false, preStart: '', preEnd: '', preDeputy: '', preStatus: '', preReason: '' });
                }
            });
        }

        memberRef.on('value', (sn) => {
            memberStates = sn.val() || {};
            smartSyncPersonnel(memberStates);
            const preLeaveList = document.getElementById('pre-leave-list');
            const preLeavers = allIds.filter(id => memberStates[id]?.preLeave);
            if (preLeavers.length > 0) {
                preLeaveList.innerHTML = preLeavers.map(id => {
                    const d = memberStates[id];
                    const rText = (d.preReason && d.preStatus !== '輪休' && d.preStatus !== '慰休') ? `: ${d.preReason}` : "";
                    return `<div class="bg-slate-800/50 p-1.5 rounded-lg border-l-2 border-amber-500 flex justify-between items-center"><span class="text-white font-bold">${id} <span class="text-amber-500">(${d.preStatus}${rText})</span></span><span class="text-slate-400 font-mono text-[8px]">${d.preStart.slice(5,16).replace('T',' ')} ~ ${d.preEnd.slice(5,16).replace('T',' ')}</span></div>`;
                }).join('');
            } else preLeaveList.innerHTML = `<div class="text-slate-500 italic text-[10px]">目前無預放人員</div>`;

            allIds.forEach(id => {
                const d = memberStates[id]; if(!d) return;
                document.getElementById(`tag-${id}`).textContent = d.status;
                document.getElementById(`tag-${id}`).className = `px-2 py-0.5 rounded text-[9px] font-bold bg-${d.status} text-white`;
                let info = "";
                if(d.start && d.end) {
                    const r = (d.reason && d.status !== '輪休' && d.status !== '慰休') ? ` 原因:${d.reason}` : "";
                    info += `[時:${d.start.slice(5,16).replace('T',' ')} ~ ${d.end.slice(5,16).replace('T',' ')} 代:${d.deputy||'無'}${r}] `;
                }
                if(d.preLeave && d.preStart && d.preEnd) {
                    const pr = (d.preReason && d.preStatus !== '輪休' && d.preStatus !== '慰休') ? ` 原因:${d.preReason}` : "";
                    info += `[預(${d.preStatus}):${d.preStart.slice(5,16).replace('T',' ')} ~ ${d.preEnd.slice(5,16).replace('T',' ')}${pr}]`;
                }
                document.getElementById(`detail-${id}`).textContent = info;
                document.getElementById(`pre-${id}`).className = d.preLeave ? "text-[9px] px-2 py-1 rounded pre-leave-active font-bold shadow-lg" : "text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500";
                document.querySelectorAll(`[id^="btn-${id}-"]`).forEach(b => b.classList.remove('active-status'));
                const btn = document.getElementById(`btn-${id}-${d.status}`); if(btn) btn.classList.add('active-status');
            });
            const board = document.getElementById('stat-board'); board.innerHTML = "";
            statuses.forEach(s => {
                const f = allIds.filter(id => memberStates[id]?.status === s);
                if(f.length>0) board.innerHTML += `<div class="bg-slate-800 p-2 rounded-lg mb-1 flex justify-between tracking-tighter"><span>${s}</span><span class="text-amber-500 font-bold">${f.join(',')}</span></div>`;
            });
        });

        function copyMealReport() {
            try {
                const times = [
                    {n: "週六早餐", t: "2026-05-16T07:00", m: "早"}, {n: "週六中餐", t: "2026-05-16T11:00", m: "中"}, {n: "週六晚餐", t: "2026-05-16T17:00", m: "晚"},
                    {n: "週日早餐", t: "2026-05-17T07:00", m: "早"}, {n: "週日中餐", t: "2026-05-17T11:00", m: "中"}, {n: "週日晚餐", t: "2026-05-17T17:00", m: "晚"},
                    {n: "週一早餐", t: "2026-05-18T07:00", m: "早"}
                ];
                let reportText = "61艇伙食統計表\n\n";
                times.forEach(tm => {
                    const targetT = parseToTime(tm.t);
                    const dutyTeam = getDutyByDate(tm.t);
                    const eaters = allIds.filter(id => {
                        const d = memberStates[id]; if(!d || d.status === '空員') return false;
                        const isDeputyNow = allIds.some(oid => {
                            const od = memberStates[oid]; if(!od) return false;
                            const st = parseToTime(od.start), et = parseToTime(od.end);
                            return (od.deputy === id && targetT >= st && targetT < et);
                        });
                        if (isDeputyNow) return true;
                        const checkL = (s, e) => {
                            if(!s || !e) return false;
                            const sT = parseToTime(s), eT = parseToTime(e);
                            if (tm.m === '早' && targetT === sT) return false; 
                            return (targetT >= sT && targetT < eT);
                        };
                        if ((d.status === '受訓' || d.status === '公假') && checkL(d.start, d.end)) return false;
                        if (checkL(d.start, d.end)) return false;
                        if (tm.m === '早') return true;
                        return (leftTeam.includes(id) ? "左" : "右") === dutyTeam;
                    }).sort((a,b) => parseInt(a)-parseInt(b));
                    reportText += `${tm.n}：${eaters.join('、')}\n`;
                });
                navigator.clipboard.writeText(reportText).then(() => alert("伙食名單已複製！"));
            } catch (err) { alert("出錯：" + err.message); }
        }

        function copyStatusReport() {
            let text = "61艇人員動態回報\n";
            ['受訓', '公假', '外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假'].forEach(s => {
                const f = allIds.filter(id => memberStates[id]?.status === s).map(id => id);
                if (f.length > 0) text += `${s}${f.length}員：${f.join('、')}\n`;
            });
            navigator.clipboard.writeText(text).then(() => alert("動態已複製"));
        }
        window.onload = initApp;
    </script>
