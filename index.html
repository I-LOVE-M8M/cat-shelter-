<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧伙食與動態管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .status-btn { transition: all 0.1s; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .active-status { border: 2px solid #fbbf24 !important; background-color: #fbbf24 !important; color: #000 !important; font-weight: bold; }
        
        /* 狀態顏色定義 */
        .bg-正常, .bg-開船, .bg-駐艇, .bg-值更, .bg-碼巡, .bg-洽公, .bg-幫廚, .bg-補眠 { background-color: #1e293b; border: 1px solid #334155; }
        .bg-外宿, .bg-放假班 { background-color: #f59e0b; }
        .bg-輪休, .bg-慰休, .bg-喪假, .bg-事假, .bg-病假 { background-color: #ef4444; }
        .bg-受訓 { background-color: #3b82f6; }
        .bg-公假 { background-color: #a855f7; }
        .bg-空員 { background-color: #334155; opacity: 0.5; }
        
        #modal { display: none; background: rgba(0,0,0,0.9); }
        .pre-leave-active { background-color: #f43f5e !important; border: 2px solid #fb7185 !important; color: white !important; }
    </style>
</head>
<body class="min-h-screen pb-32 text-xs sm:text-sm">

    <div class="max-w-4xl mx-auto px-3 pt-6 sticky top-0 z-40">
        <div class="bg-slate-800 rounded-3xl p-4 shadow-2xl border border-slate-700 flex flex-col gap-3">
            <div class="flex justify-between items-center px-2">
                <div>
                    <h1 id="today-duty" class="text-amber-400 text-[10px] font-bold italic tracking-wider">載入中...</h1>
                    <div class="text-sm font-bold text-slate-300 italic">PERSONNEL & MEAL OPS</div>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyMealReport()" class="bg-blue-600 hover:bg-blue-500 text-[10px] px-3 py-2 rounded-lg font-bold shadow-lg transition-all active:scale-95">📋 複製伙食</button>
                    <button onclick="copyStatusReport()" class="bg-emerald-600 hover:bg-emerald-500 text-[10px] px-3 py-2 rounded-lg font-bold shadow-lg transition-all active:scale-95">📋 複製動態</button>
                </div>
            </div>
            
            <div id="top-pre-leave-board" class="bg-slate-900/50 rounded-2xl p-3 border border-amber-500/30 mx-1 mb-1">
                <div class="text-[10px] text-amber-500 font-bold mb-1 flex items-center gap-1">
                    <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span></span>
                    預放人員看板
                </div>
                <div id="pre-leave-list" class="text-[9px] text-slate-400 space-y-1">
                    載入中...
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-3 mt-4 space-y-3" id="app"></div>

    <div class="max-w-4xl mx-auto px-3 mt-6 pb-10 text-[10px]">
        <div class="bg-slate-900/80 rounded-2xl p-4 border border-slate-700" id="stat-board"></div>
    </div>

    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-2xl text-sm">
            <h2 id="modal-title" class="text-xl font-bold text-white mb-2 text-center italic">設定詳情</h2>
            <div class="space-y-4 mt-4">
                <div id="pre-status-container" class="hidden">
                    <label class="block text-slate-400 mb-1 font-bold">預放種類</label>
                    <select id="pre-status-select" onchange="toggleReasonField()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">
                        <option value="輪休">輪休</option>
                        <option value="預放">預放</option>
                        <option value="慰休">慰休</option>
                        <option value="受訓">受訓</option>
                        <option value="公假">公假</option>
                        <option value="喪假">喪假</option>
                        <option value="事假">事假</option>
                        <option value="病假">病假</option>
                    </select>
                </div>
                <div id="reason-container">
                    <label class="block text-slate-400 mb-1 font-bold">請假原因</label>
                    <input type="text" id="leave-reason" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none" placeholder="例如：回診、家事...">
                </div>
                <div><label class="block text-slate-400 mb-1 font-bold">開始/離營時間</label>
                <input type="datetime-local" id="start-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none"></div>
                <div><label class="block text-slate-400 mb-1 font-bold italic underline decoration-amber-500">結束/歸營時間</label>
                <input type="datetime-local" id="end-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none"></div>
                <div><label class="block text-slate-400 mb-1 font-bold">職務代理人</label>
                <select id="deputy" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none"><option value="無">無</option></select></div>
            </div>
            <div class="flex flex-col gap-2 mt-6">
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="flex-1 bg-slate-700 py-2 rounded-xl font-bold active:scale-95 transition-all">取消</button>
                    <button onclick="saveModal()" class="flex-1 bg-indigo-600 py-2 rounded-xl font-bold active:scale-95 transition-all">儲存</button>
                </div>
                <button onclick="clearSpecificData()" class="w-full bg-rose-900/40 text-rose-300 py-2 rounded-xl font-bold text-[10px] border border-rose-800 active:scale-95">清除紀錄</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBSQnV0F2XFXhlca57uB653lNp99WJ1Asg",
          authDomain: "cat-shelter-49c2e.firebaseapp.com",
          databaseURL: "https://cat-shelter-49c2e-default-rtdb.firebaseio.com",
          projectId: "cat-shelter-49c2e",
          storageBucket: "cat-shelter-49c2e.firebasestorage.app",
          messagingSenderId: "325127819712",
          appId: "1:325127819712:web:28650c1e975de03fedb825",
          measurementId: "G-STQT6CZRHS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const memberRef = db.ref('personnel_v2');

        const leftTeam = ['04', '05', '06', '10', '12', '15', '16'];
        const rightTeam = ['03', '07', '08', '09', '11', '13', '14', '17'];
        const allIds = [...leftTeam, ...rightTeam].sort((a,b) => parseInt(a) - parseInt(b));
        const statuses = ['正常', '開船', '駐艇', '值更', '碼巡', '洽公', '幫廚', '補眠', '外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假', '受訓', '公假', '空員'];
        
        let memberStates = {};
        let currentEditingId = null;
        let editMode = ""; 

        function parseToTime(str) {
            if (!str) return 0;
            return new Date(str.replace(/-/g, '/').replace('T', ' ')).getTime();
        }

        function getDutyByDate(dateStr) {
            const base = new Date('2026/05/05 00:00:00');
            const target = new Date(dateStr.split('T')[0].replace(/-/g, '/') + ' 00:00:00');
            const diff = Math.round((target - base) / 86400000);
            return (Math.abs(diff) % 2 === 0) ? "左" : "右";
        }

        // 切換原因欄位顯示邏輯
        function toggleReasonField() {
            const currentStatus = (editMode === 'pre') ? document.getElementById('pre-status-select').value : memberStates[currentEditingId].status;
            const container = document.getElementById('reason-container');
            // 如果是輪休或慰休，隱藏原因輸入框
            if (currentStatus === '輪休' || currentStatus === '慰休') {
                container.style.display = 'none';
            } else {
                container.style.display = 'block';
            }
        }

        function initApp() {
            const app = document.getElementById('app');
            const deputySelect = document.getElementById('deputy');
            allIds.forEach(id => {
                const opt = document.createElement('option'); opt.value = id; opt.textContent = id;
                deputySelect.appendChild(opt);
                const team = leftTeam.includes(id) ? '左' : '右';
                const card = document.createElement('div');
                card.id = `card-${id}`;
                card.className = "bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50";
                card.innerHTML = `<div class="flex justify-between items-center mb-2 px-1"><div class="flex items-center gap-2"><span class="w-6 h-6 flex items-center justify-center rounded bg-slate-900 text-slate-400 font-mono text-xs font-bold">${id}</span><span class="text-[9px] text-slate-500 font-bold">${team}班</span><span id="tag-${id}" class="px-2 py-0.5 rounded text-[9px] font-bold bg-正常 text-white">...</span></div><button id="pre-${id}" onclick="openConfigModal('${id}', 'pre')" class="text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500 transition-all active:scale-95">預放</button></div><div id="detail-${id}" class="text-[8px] text-amber-400 font-bold mb-2 px-1 min-h-[14px] leading-tight"></div><div class="grid grid-cols-4 gap-1">${statuses.map(s => `<button onclick="handleStatusClick('${id}', '${s}')" id="btn-${id}-${s}" class="status-btn py-2 rounded-md text-[9px] bg-slate-900/40 text-slate-400">${s}</button>`).join('')}</div>`;
                app.appendChild(card);
            });
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('today-duty').textContent = `📅 今日當值：${getDutyByDate(today)}班`;
        }

        function openConfigModal(id, m) {
            currentEditingId = id.toString(); editMode = m;
            const d = memberStates[currentEditingId] || {};
            const nowDay = new Date().toISOString().split('T')[0];
            
            document.getElementById('pre-status-container').className = (m === 'pre') ? "block" : "hidden";
            let defaultHour = (m !== 'pre' && d.status === '輪休') ? "17:00" : "07:00";
            
            document.getElementById('start-time').value = (m==='pre' ? d.preStart : d.start) || `${nowDay}T${defaultHour}`;
            document.getElementById('end-time').value = (m==='pre' ? d.preEnd : d.end) || `${nowDay}T${defaultHour}`;
            document.getElementById('deputy').value = (m==='pre' ? d.preDeputy : d.deputy) || "無";
            document.getElementById('pre-status-select').value = d.preStatus || "輪休";
            document.getElementById('leave-reason').value = (m==='pre' ? d.preReason : d.reason) || "";
            
            toggleReasonField(); // 初始檢查是否顯示原因框
            document.getElementById('modal-title').textContent = (m === 'pre' ? `預放設定 - ${id}號` : `詳情設定 - ${id}號`);
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        function clearSpecificData() {
            const up = editMode === 'pre' ? 
                { preLeave: false, preStart: '', preEnd: '', preDeputy: '', preStatus: '', preReason: '' } : 
                { start: '', end: '', deputy: '', reason: '' };
            memberRef.child(currentEditingId).update(up);
            closeModal();
        }

        function handleStatusClick(id, s) {
            if (['輪休', '慰休', '喪假', '事假', '病假', '受訓', '公假'].includes(s)) {
                memberRef.child(id).update({ status: s });
                openConfigModal(id, 'leave');
            } else { 
                memberRef.child(id).update({ status: s }); 
            }
        }

        function saveModal() {
            const s = document.getElementById('start-time').value, 
                  e = document.getElementById('end-time').value, 
                  d = document.getElementById('deputy').value,
                  ps = document.getElementById('pre-status-select').value,
                  reason = document.getElementById('leave-reason').value;
            
            const up = editMode === 'pre' ? 
                { preLeave: true, preStart: s, preEnd: e, preDeputy: d, preStatus: ps, preReason: reason } : 
                { start: s, end: e, deputy: d, reason: reason };
            
            memberRef.child(currentEditingId).update(up);
            closeModal();
        }

        function smartSyncPersonnel(states) {
            const now = new Date().getTime();
            Object.keys(states).forEach(id => {
                const d = states[id];
                const preStartT = parseToTime(d.preStart);
                const mainEndT = parseToTime(d.end);
                if (d.preLeave && preStartT > 0 && now >= preStartT) {
                    memberRef.child(id).update({
                        status: d.preStatus || '輪休',
                        start: d.preStart, end: d.preEnd, deputy: d.preDeputy, reason: d.preReason || '',
                        preLeave: false, preStart: '', preEnd: '', preDeputy: '', preStatus: '', preReason: ''
                    });
                } else if (d.status !== '正常' && d.status !== '空員' && mainEndT > 0 && now >= mainEndT) {
                    memberRef.child(id).update({
                        status: '正常', start: '', end: '', deputy: '', reason: '',
                        preLeave: false, preStart: '', preEnd: '', preDeputy: '', preStatus: '', preReason: ''
                    });
                }
            });
        }

        memberRef.on('value', (sn) => {
            memberStates = sn.val() || {};
            smartSyncPersonnel(memberStates);

            const preLeaveList = document.getElementById('pre-leave-list');
            const preLeavers = allIds.filter(id => memberStates[id]?.preLeave);
            
            if (preLeavers.length > 0) {
                preLeaveList.innerHTML = preLeavers.map(id => {
                    const d = memberStates[id];
                    const reasonText = (d.preReason && d.preStatus !== '輪休' && d.preStatus !== '慰休') ? `: ${d.preReason}` : "";
                    return `<div class="bg-slate-800/50 p-1.5 rounded-lg border-l-2 border-amber-500 flex justify-between items-center">
                        <span class="text-white font-bold">${id} <span class="text-amber-500">(${d.preStatus}${reasonText})</span></span>
                        <span class="text-slate-400 font-mono">${d.preStart.slice(5,16).replace('T',' ')} ~ ${d.preEnd.slice(5,16).replace('T',' ')}</span>
                    </div>`;
                }).join('');
            } else {
                preLeaveList.innerHTML = `<div class="text-slate-500 italic">目前無預放人員</div>`;
            }

            allIds.forEach(id => {
                const d = memberStates[id]; if(!d) return;
                document.getElementById(`tag-${id}`).textContent = d.status;
                document.getElementById(`tag-${id}`).className = `px-2 py-0.5 rounded text-[9px] font-bold bg-${d.status} text-white`;
                
                let info = "";
                if(d.start && d.end) {
                    const r = (d.reason && d.status !== '輪休' && d.status !== '慰休') ? ` 原因:${d.reason}` : "";
                    info += `[時:${d.start.slice(5,16).replace('T',' ')} ~ ${d.end.slice(5,16).replace('T',' ')} 代:${d.deputy||'無'}${r}] `;
                }
                if(d.preLeave && d.preStart && d.preEnd) {
                    const pr = (d.preReason && d.preStatus !== '輪休' && d.preStatus !== '慰休') ? ` 原因:${d.preReason}` : "";
                    info += `[預(${d.preStatus}):${d.preStart.slice(5,16).replace('T',' ')} ~ ${d.preEnd.slice(5,16).replace('T',' ')}${pr}]`;
                }
                
                document.getElementById(`detail-${id}`).textContent = info;
                document.getElementById(`pre-${id}`).className = d.preLeave ? "text-[9px] px-2 py-1 rounded pre-leave-active font-bold shadow-lg" : "text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500";
                document.querySelectorAll(`[id^="btn-${id}-"]`).forEach(b => b.classList.remove('active-status'));
                const btn = document.getElementById(`btn-${id}-${d.status}`); if(btn) btn.classList.add('active-status');
            });
            
            const board = document.getElementById('stat-board'); board.innerHTML = "";
            statuses.forEach(s => {
                const f = allIds.filter(id => memberStates[id]?.status === s);
                if(f.length>0) board.innerHTML += `<div class="bg-slate-800 p-2 rounded-lg mb-1 flex justify-between tracking-tighter"><span>${s}</span><span class="text-amber-500 font-bold">${f.join(',')}</span></div>`;
            });
        });

        function copyMealReport() {
            try {
                const times = [
                    {n: "週六早餐", t: "2026-05-09T07:00", m: "早"}, {n: "週六中餐", t: "2026-05-09T11:00", m: "中"}, {n: "週六晚餐", t: "2026-05-09T17:00", m: "晚"},
                    {n: "週日早餐", t: "2026-05-10T07:00", m: "早"}, {n: "週日中餐", t: "2026-05-10T11:00", m: "中"}, {n: "週日晚餐", t: "2026-05-10T17:00", m: "晚"},
                    {n: "週一早餐", t: "2026-05-11T07:00", m: "早"}
                ];
                let reportText = "61艇伙食統計表\n\n";
                times.forEach(tm => {
                    const targetT = parseToTime(tm.t);
                    const dutyTeam = getDutyByDate(tm.t);
                    const eaters = allIds.filter(id => {
                        const d = memberStates[id]; if(!d || d.status === '空員') return false;
                        const myT = leftTeam.includes(id) ? "左" : "右";
                        const isDeputyNow = allIds.some(oid => {
                            const od = memberStates[oid]; if(!od) return false;
                            const st = parseToTime(od.start), et = parseToTime(od.end);
                            return (od.deputy === id && targetT >= st && targetT < et);
                        });
                        if (isDeputyNow) return true;
                        const checkLeave = (start, end) => {
                            if(!start || !end) return false;
                            const sT = parseToTime(start), eT = parseToTime(end);
                            if (tm.m === '早' && targetT === sT) return false; 
                            return (targetT >= sT && targetT < eT);
                        };
                        if ((d.status === '受訓' || d.status === '公假') && checkLeave(d.start, d.end)) return false;
                        if (checkLeave(d.start, d.end)) return false;
                        if (tm.m === '早') return true;
                        return myT === dutyTeam;
                    }).sort((a,b) => parseInt(a)-parseInt(b));
                    reportText += `${tm.n}：${eaters.join('、')}\n`;
                });
                navigator.clipboard.writeText(reportText).then(() => alert("伙食名單已複製！"));
            } catch (err) { alert("出錯：" + err.message); }
        }

        function copyStatusReport() {
            let text = "61艇人員動態回報\n";
            ['受訓', '公假', '外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假'].forEach(s => {
                const f = allIds.filter(id => memberStates[id]?.status === s).map(id => id);
                if (f.length > 0) text += `${s}${f.length}員：${f.join('、')}\n`;
            });
            navigator.clipboard.writeText(text).then(() => alert("動態回報已複製"));
        }
        window.onload = initApp;
    </script>
</body>
</html>
