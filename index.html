<script>
function copyMealReport() {
    const times = [
        {n: "週六早餐", t: "2026-05-09T07:00", m: "早"},
        {n: "週六中餐", t: "2026-05-09T11:00", m: "中"},
        {n: "週六晚餐", t: "2026-05-09T17:00", m: "晚"},
        {n: "週日早餐", t: "2026-05-10T07:00", m: "早"},
        {n: "週日中餐", t: "2026-05-10T11:00", m: "中"},
        {n: "週日晚餐", t: "2026-05-10T17:00", m: "晚"},
        {n: "週一早餐", t: "2026-05-11T07:00", m: "早"}
    ];

    let report = "61艇伙食統計表\n\n";

    times.forEach(tm => {
        const targetT = parseToTime(tm.t);
        const dutyT = getDutyTeamByDate(tm.t);

        const eaters = allIds.filter(id => {
            const d = memberStates[id];
            if (!d || d.status === '空員') return false;

            const myT = leftTeam.includes(id) ? "左" : "右";

            // =========================
            // 1️⃣ 職務代理（最高優先）
            // =========================
            const isDeputy = allIds.some(oid => {
                const od = memberStates[oid];
                if (!od) return false;

                const s = parseToTime(od.start || od.preStart);
                const e = parseToTime(od.end || od.preEnd);

                return (od.deputy === id || od.preDeputy === id)
                    && targetT >= s && targetT < e;
            });

            if (isDeputy) return true;

            // =========================
            // 2️⃣ 預放（🔥修正重點）
            // =========================
            const preST = parseToTime(d.preStart);
            const preET = parseToTime(d.preEnd);

            if (d.preLeave && preST && preET && targetT >= preST && targetT < preET) {
                return false; // 預放時間內一律不吃（包含早餐）
            }

            // =========================
            // 3️⃣ 一般假期
            // =========================
            const checkLeave = (start, end) => {
                const sT = parseToTime(start);
                const eT = parseToTime(end);
                if (!sT || !eT) return false;

                // 早餐特例（只給正式放假）
                if (tm.m === '早' && targetT === sT) return false;

                return (targetT >= sT && targetT < eT);
            };

            if (checkLeave(d.start, d.end)) return false;

            // =========================
            // 4️⃣ 早餐（全員吃）
            // =========================
            if (tm.m === '早') return true;

            // =========================
            // 5️⃣ 中晚餐（當值班）
            // =========================
            if (myT !== dutyT) return false;

            // =========================
            // 6️⃣ 防呆（假但沒填時間）
            // =========================
            const leaveS = ['輪休', '慰休', '喪假', '事假', '病假', '外宿', '放假班'];
            if (leaveS.includes(d.status) && !d.start && !d.preStart && !d.preLeave) {
                return false;
            }

            return true;

        }).sort((a,b) => parseInt(a)-parseInt(b)).join('、');

        report += `${tm.n}：${eaters}\n`;
    });

    navigator.clipboard.writeText(report)
        .then(() => alert("伙食名單已正確排除「預放人員」與「放假班」。"));
}
</script>
