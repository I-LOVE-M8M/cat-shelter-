<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧伙食與動態管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .status-btn { transition: all 0.1s; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .active-status { border: 2px solid #fbbf24 !important; background-color: #fbbf24 !important; color: #000 !important; font-weight: bold; }
        .bg-正常, .bg-開船, .bg-駐艇, .bg-值更, .bg-碼巡, .bg-洽公, .bg-幫廚, .bg-補眠 { background-color: #1e293b; border: 1px solid #334155; }
        .bg-外宿, .bg-放假班 { background-color: #f59e0b; }
        .bg-輪休, .bg-慰休, .bg-喪假, .bg-事假, .bg-病假 { background-color: #ef4444; }
        .bg-受訓 { background-color: #3b82f6; }
        .bg-公假 { background-color: #a855f7; }
        .bg-空員 { background-color: #334155; opacity: 0.5; }
        #modal { display: none; background: rgba(0,0,0,0.9); }
        .pre-leave-active { background-color: #f43f5e !important; border: 2px solid #fb7185 !important; color: white !important; }
        .batch-checkbox { transform: scale(1.5); }
    </style>
</head>
<body class="min-h-screen pb-32 text-xs sm:text-sm">

    <div class="max-w-4xl mx-auto px-3 pt-6 sticky top-0 z-40">
        <div class="bg-slate-800 rounded-3xl p-4 shadow-2xl border border-slate-700 flex flex-col gap-3">
            <div class="flex justify-between items-start px-2">
                <div class="space-y-1">
                    <h1 id="today-duty" class="text-amber-400 text-[10px] font-bold italic tracking-wider uppercase">載入中...</h1>
                    <div class="flex items-center gap-2">
                        <div class="text-[9px] text-slate-400 font-bold flex items-center gap-1">🌇 日落：<span id="sunset-time" class="text-rose-400">讀取中</span></div>
                    </div>
                </div>
                <div class="flex gap-1.5 items-center">
                    <select id="week-select" class="bg-slate-700 text-[10px] px-1.5 py-2 rounded-lg font-bold border border-slate-600 text-amber-400 outline-none cursor-pointer">
                        <option value="this">本週伙食</option>
                        <option value="next">下週伙食 ➔</option>
                    </select>
                    <button onclick="copyMealReport()" class="bg-blue-600 text-[10px] px-2 py-2 rounded-lg font-bold shadow-lg">📋 複製伙食</button>
                    <button onclick="copyStatusReport()" class="bg-emerald-600 text-[10px] px-2 py-2 rounded-lg font-bold shadow-lg">📋 複製動態</button>
                </div>
            </div>
            
            <div class="flex gap-2 p-2 bg-slate-900 rounded-xl border border-slate-700 items-center">
                <button onclick="toggleBatchMode()" id="batch-toggle-btn" class="bg-slate-700 px-3 py-1 rounded font-bold">批次預放模式</button>
                <button onclick="openBatchModal()" id="batch-action-btn" class="hidden bg-indigo-600 px-3 py-1 rounded font-bold">執行選取預放</button>
            </div>

            <div id="top-pre-leave-board" class="bg-slate-900/50 rounded-2xl p-3 border border-amber-500/30 mx-1">
                <div class="text-[10px] text-amber-500 font-bold mb-1">預放人員看板</div>
                <div id="pre-leave-list" class="text-[9px] text-slate-400 space-y-1">載入中...</div>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-3 mt-4 space-y-3" id="app"></div>
    <div class="max-w-4xl mx-auto px-3 mt-6 pb-10 text-[10px]" id="stat-board"></div>

    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-2xl text-sm">
            <h2 id="modal-title" class="text-xl font-bold text-white mb-4 text-center">詳情設定</h2>
            <div class="space-y-4">
                <div id="pre-status-container" class="hidden">
                    <label class="block text-slate-400 mb-1">預放種類</label>
                    <select id="pre-status-select" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none">
                        <option value="輪休">輪休</option><option value="預放">預放</option><option value="慰休">慰休</option><option value="受訓">受訓</option><option value="公假">公假</option><option value="喪假">喪假</option><option value="事假">事假</option><option value="病假">病假</option>
                    </select>
                </div>
                <div><label class="block text-slate-400 mb-1">開始時間</label><input type="datetime-local" id="start-time" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none"></div>
                <div><label class="block text-slate-400 mb-1">結束時間</label><input type="datetime-local" id="end-time" class="w-full bg-slate-900 rounded-lg p-2 text-white outline-none"></div>
            </div>
            <div class="flex flex-col gap-2 mt-6">
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="flex-1 bg-slate-700 py-2 rounded-xl font-bold">取消</button>
                    <button onclick="saveModal()" class="flex-1 bg-indigo-600 py-2 rounded-xl font-bold">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBSQnV0F2XFXhlca57uB653lNp99WJ1Asg", authDomain: "cat-shelter-49c2e.firebaseapp.com", databaseURL: "https://cat-shelter-49c2e-default-rtdb.firebaseio.com", projectId: "cat-shelter-49c2e", storageBucket: "cat-shelter-49c2e.firebasestorage.app", messagingSenderId: "325127819712", appId: "1:325127819712:web:28650c1e975de03fedb825", measurementId: "G-STQT6CZRHS" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), memberRef = db.ref('personnel_v2');
        const leftTeam = ['04', '05', '06', '10', '12', '15', '16'], rightTeam = ['03', '07', '08', '09', '11', '13', '14', '17'];
        const allIds = [...leftTeam, ...rightTeam].sort((a,b) => parseInt(a) - parseInt(b));
        const statuses = ['正常', '開船', '駐艇', '值更', '碼巡', '洽公', '幫廚', '補眠', '外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假', '受訓', '公假', '空員'];
        
        let memberStates = {}, currentEditingId = null, editMode = "", isBatchMode = false;
        let selectedBatchIds = new Set();

        function toggleBatchMode() {
            isBatchMode = !isBatchMode;
            document.getElementById('batch-toggle-btn').classList.toggle('bg-indigo-600');
            document.getElementById('batch-action-btn').classList.toggle('hidden');
            initApp();
        }

        function initApp() {
            const app = document.getElementById('app');
            app.innerHTML = "";
            allIds.forEach(id => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2 px-1">
                        <div class="flex items-center gap-2">
                            ${isBatchMode ? `<input type="checkbox" class="batch-checkbox" onchange="toggleBatchId('${id}')" ${selectedBatchIds.has(id)?'checked':''}>` : ''}
                            <span class="w-6 h-6 flex items-center justify-center rounded bg-slate-900 text-slate-400 font-mono text-xs font-bold">${id}</span>
                            <span id="tag-${id}" class="px-2 py-0.5 rounded text-[9px] font-bold">正常</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-1">${statuses.map(s => `<button onclick="handleStatusClick('${id}', '${s}')" id="btn-${id}-${s}" class="status-btn py-1.5 rounded-md text-[9px] bg-slate-900/40 text-slate-400">${s}</button>`).join('')}</div>`;
                app.appendChild(card);
            });
        }

        function toggleBatchId(id) {
            if(selectedBatchIds.has(id)) selectedBatchIds.delete(id);
            else selectedBatchIds.add(id);
        }

        function openBatchModal() {
            if(selectedBatchIds.size === 0) return alert("請先勾選人員");
            currentEditingId = 'BATCH'; editMode = 'pre';
            document.getElementById('pre-status-container').className = "block";
            document.getElementById('modal').style.display = 'flex';
        }

        function saveModal() {
            const s = document.getElementById('start-time').value, e = document.getElementById('end-time').value;
            const ps = document.getElementById('pre-status-select').value;
            
            if (currentEditingId === 'BATCH') {
                selectedBatchIds.forEach(id => {
                    memberRef.child(id).update({ preLeave: true, preStart: s, preEnd: e, preStatus: ps });
                });
                selectedBatchIds.clear();
                toggleBatchMode();
            } else {
                memberRef.child(currentEditingId).update({ status: ps, start: s, end: e });
            }
            closeModal();
        }

        function handleStatusClick(id, s) {
            if(isBatchMode) return;
            memberRef.child(id).update({ status: s });
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        memberRef.on('value', (sn) => {
            memberStates = sn.val() || {};
            // 更新 UI 狀態
            allIds.forEach(id => {
                const d = memberStates[id] || {};
                const tag = document.getElementById(`tag-${id}`);
                if(tag) {
                    tag.textContent = d.status || '正常';
                    tag.className = `px-2 py-0.5 rounded text-[9px] font-bold bg-${d.status || '正常'} text-white`;
                }
            });
        });

        // 簡化後的伙食計算：只要非請假狀態即為留守
        function copyMealReport() {
            const dates = getTargetDates();
            let reportText = "61艇伙食統計表\n\n";
            const times = [{n: "週六早餐", t: `${dates.sat}T07:00`}, {n: "週六中餐", t: `${dates.sat}T11:00`} /* ...以此類推 */];
            
            times.forEach(tm => {
                const eaters = allIds.filter(id => {
                    const d = memberStates[id];
                    // 只要狀態是正常，且沒被預放蓋掉，就視為留守
                    return d && d.status === '正常' && !d.preLeave;
                });
                reportText += `${tm.n} (留守 ${eaters.length}員)：${eaters.join('、')}\n`;
            });
            navigator.clipboard.writeText(reportText).then(() => alert("伙食名單已複製！"));
        }

        function getTargetDates() { /* 原有日期邏輯 */ return {sat: '2026-05-30', sun: '2026-05-31', mon: '2026-06-01'}; }
        function copyStatusReport() { /* 原有複製邏輯 */ }
        window.onload = initApp;
    </script>
</body>
</html>
