<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧伙食與動態管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: white; }
        .status-btn { transition: all 0.1s; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .active-status { border: 2px solid #fbbf24 !important; background-color: #fbbf24 !important; color: #000 !important; font-weight: bold; }
        .bg-正常, .bg-開船, .bg-駐艇, .bg-值更, .bg-碼巡, .bg-洽公, .bg-幫廚, .bg-補眠 { background-color: #1e293b; border: 1px solid #334155; }
        .bg-外宿 { background-color: #a855f7; }
        .bg-放假班 { background-color: #f59e0b; }
        .bg-輪休, .bg-慰休, .bg-喪假, .bg-事假, .bg-病假 { background-color: #ef4444; }
        .bg-空員 { background-color: #334155; opacity: 0.5; }
        #modal { display: none; background: rgba(0,0,0,0.9); }
        .pre-leave-active { background-color: #f43f5e !important; border: 2px solid #fb7185 !important; color: white !important; }
    </style>
</head>
<body class="min-h-screen pb-32 text-xs sm:text-sm">

    <div class="max-w-4xl mx-auto px-3 pt-6 sticky top-0 z-40">
        <div class="bg-slate-800 rounded-3xl p-4 shadow-2xl border border-slate-700 flex justify-between items-center">
            <div>
                <h1 id="today-duty" class="text-amber-400 text-[10px] font-bold italic tracking-wider">載入中...</h1>
                <div class="text-sm font-bold text-slate-300 tracking-tight italic uppercase">Ops Management</div>
            </div>
            <div class="flex gap-2">
                <button onclick="copyMealReport()" class="bg-blue-600 hover:bg-blue-500 text-[10px] px-3 py-2 rounded-lg font-bold shadow-lg transition-all active:scale-95">📋 複製伙食</button>
                <button onclick="copyStatusReport()" class="bg-emerald-600 hover:bg-emerald-500 text-[10px] px-3 py-2 rounded-lg font-bold shadow-lg transition-all active:scale-95">📋 複製動態</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-3 mt-4 space-y-3" id="app"></div>

    <div class="max-w-4xl mx-auto px-3 mt-6 pb-10">
        <div class="bg-slate-900/80 rounded-2xl p-4 border border-slate-700">
            <div id="stat-board" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-2xl">
            <h2 id="modal-title" class="text-xl font-bold text-white mb-2 italic">設定</h2>
            <div class="space-y-4 text-sm mt-4">
                <div>
                    <label class="block text-slate-400 mb-1 font-bold">開始時間</label>
                    <input type="datetime-local" id="start-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-bold italic underline decoration-amber-500">結束/歸營時間</label>
                    <input type="datetime-local" id="end-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-bold">職務代理人</label>
                    <select id="deputy" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white outline-none"><option value="無">無</option></select>
                </div>
            </div>
            <div class="flex flex-col gap-2 mt-6">
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="flex-1 bg-slate-700 py-2 rounded-xl font-bold text-xs active:scale-95 transition-all">取消</button>
                    <button onclick="saveModal()" class="flex-1 bg-indigo-600 py-2 rounded-xl font-bold text-xs active:scale-95 transition-all">儲存</button>
                </div>
                <button onclick="clearSpecificData()" class="w-full bg-rose-900/40 text-rose-300 py-2 rounded-xl font-bold text-[10px] border border-rose-800 active:scale-95 transition-all">清除此筆時間與職代</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBSQnV0F2XFXhlca57uB653lNp99WJ1Asg",
          authDomain: "cat-shelter-49c2e.firebaseapp.com",
          databaseURL: "https://cat-shelter-49c2e-default-rtdb.firebaseio.com",
          projectId: "cat-shelter-49c2e",
          storageBucket: "cat-shelter-49c2e.firebasestorage.app",
          messagingSenderId: "325127819712",
          appId: "1:325127819712:web:28650c1e975de03fedb825",
          measurementId: "G-STQT6CZRHS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const memberRef = db.ref('personnel_v2');

        const statuses = ['正常', '開船', '駐艇', '值更', '碼巡', '洽公', '幫廚', '補眠', '外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假', '空員'];
        const leftTeam = ['04', '05', '06', '10', '12', '15', '16'];
        const rightTeam = ['03', '07', '08', '09', '11', '13', '14', '17'];
        const allIds = [...leftTeam, ...rightTeam].sort((a,b) => parseInt(a) - parseInt(b));
        
        let memberStates = {};
        let currentEditingId = null;
        let editMode = ""; 

        function initApp() {
            const app = document.getElementById('app');
            const deputySelect = document.getElementById('deputy');
            allIds.forEach(id => {
                const opt = document.createElement('option'); opt.value = id; opt.textContent = id;
                deputySelect.appendChild(opt);
                const team = leftTeam.includes(id) ? '左' : '右';
                const card = document.createElement('div');
                card.id = `card-${id}`;
                card.className = "bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 flex items-center justify-center rounded bg-slate-900 text-slate-400 font-mono text-xs font-bold">${id}</span>
                            <span class="text-[9px] text-slate-500 font-bold">${team}班</span>
                            <span id="tag-${id}" class="px-2 py-0.5 rounded text-[9px] font-bold bg-正常 text-white">...</span>
                        </div>
                        <button id="pre-${id}" onclick="openConfigModal('${id}', 'pre')" class="text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500 transition-all">預放</button>
                    </div>
                    <div id="detail-${id}" class="text-[8px] text-amber-500 font-bold mb-2 px-1 min-h-[14px]"></div>
                    <div class="grid grid-cols-4 gap-1">
                        ${statuses.map(s => `<button onclick="handleStatusClick('${id}', '${s}')" id="btn-${id}-${s}" class="status-btn py-2 rounded-md text-[9px] bg-slate-900/40 text-slate-400">${s}</button>`).join('')}
                    </div>`;
                app.appendChild(card);
            });
            const baseDate = new Date(2026, 4, 5);
            const diff = Math.floor((new Date() - baseDate) / (1000 * 60 * 60 * 24));
            document.getElementById('today-duty').textContent = (diff % 2 === 0) ? "📅 今日當值：左班" : "📅 今日當值：右班";
        }

        function openConfigModal(id, m) {
            currentEditingId = id.toString(); editMode = m;
            const d = memberStates[currentEditingId] || {};
            const nowDay = new Date().toISOString().split('T')[0];
            document.getElementById('start-time').value = (m==='pre' ? d.preStart : d.start) || `${nowDay}T17:00`;
            document.getElementById('end-time').value = (m==='pre' ? d.preEnd : d.end) || `${nowDay}T17:00`;
            document.getElementById('deputy').value = (m==='pre' ? d.preDeputy : d.deputy) || "無";
            document.getElementById('modal-title').textContent = `${currentEditingId} 號 ${m==='pre'?'預放':'假單'}設定`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function clearSpecificData() {
            const updates = editMode === 'pre' ? { preLeave: false, preStart: '', preEnd: '', preDeputy: '' } : { start: '', end: '', deputy: '' };
            memberRef.child(currentEditingId).update(updates);
            closeModal();
        }

        function handleStatusClick(id, s) {
            if (['輪休', '慰休', '喪假', '事假', '病假'].includes(s)) {
                memberRef.child(id).update({ status: s });
                openConfigModal(id, 'leave');
            } else { memberRef.child(id).update({ status: s }); }
        }

        function saveModal() {
            const s = document.getElementById('start-time').value, e = document.getElementById('end-time').value, d = document.getElementById('deputy').value;
            const updates = editMode === 'pre' ? { preLeave: true, preStart: s, preEnd: e, preDeputy: d } : { start: s, end: e, deputy: d };
            memberRef.child(currentEditingId).update(updates);
            closeModal();
        }

        memberRef.on('value', (snapshot) => {
            memberStates = snapshot.val() || {};
            allIds.forEach(id => {
                const d = memberStates[id]; if(!d) return;
                document.getElementById(`tag-${id}`).textContent = d.status;
                document.getElementById(`tag-${id}`).className = `px-2 py-0.5 rounded text-[9px] font-bold bg-${d.status} text-white`;
                let info = "";
                if(d.end) info += `[假:${d.end.slice(5,16).replace('T',' ')} 代:${d.deputy||'無'}] `;
                if(d.preLeave) info += `[預:${d.preEnd.slice(5,16).replace('T',' ')} 代:${d.preDeputy||'無'}]`;
                document.getElementById(`detail-${id}`).textContent = info;
                document.getElementById(`pre-${id}`).className = d.preLeave ? "text-[9px] px-2 py-1 rounded pre-leave-active font-bold" : "text-[9px] px-2 py-1 rounded border border-slate-600 text-slate-500";
                document.querySelectorAll(`[id^="btn-${id}-"]`).forEach(b => b.classList.remove('active-status'));
                const btn = document.getElementById(`btn-${id}-${d.status}`); if(btn) btn.classList.add('active-status');
            });
            const board = document.getElementById('stat-board'); board.innerHTML = "";
            statuses.forEach(s => {
                const f = allIds.filter(id => memberStates[id]?.status === s);
                if(f.length>0) board.innerHTML += `<div class="bg-slate-800 p-2 rounded-lg border border-slate-700/50"><div>${s}</div><div class="text-amber-500 font-mono">${f.join(',')}</div></div>`;
            });
        });

        function copyMealReport() {
            const getEaters = (time) => {
                const target = new Date(time).getTime();
                const activeDeputies = allIds.filter(id => {
                    return allIds.some(oid => {
                        const d = memberStates[oid]; if (!d) return false;
                        const s = new Date(d.start || d.preStart).getTime(), e = new Date(d.end || d.preEnd).getTime();
                        return (d.deputy === id || d.preDeputy === id) && target > s && target < e;
                    });
                });
                return allIds.filter(id => {
                    const d = memberStates[id]; if (!d || d.status === '空員') return false;
                    if (activeDeputies.includes(id)) return true;
                    if (d.preLeave && d.preStart && d.preEnd) {
                        if (target > new Date(d.preStart).getTime() && target < new Date(d.preEnd).getTime()) return false;
                    }
                    const leaveS = ['輪休', '慰休', '喪假', '事假', '病假'];
                    if (leaveS.includes(d.status) && d.start && d.end) {
                        if (target > new Date(d.start).getTime() && target < new Date(d.end).getTime()) return false;
                    }
                    return true;
                }).join('、');
            };
            const times = [
                {n: "週六早餐", t: "2026-05-09T07:00"}, {n: "週六中餐", t: "2026-05-09T11:00"}, {n: "週六晚餐", t: "2026-05-09T17:00"},
                {n: "週日早餐", t: "2026-05-10T07:00"}, {n: "週日中餐", t: "2026-05-10T11:00"}, {n: "週日晚餐", t: "2026-05-10T17:00"},
                {n: "週一早餐", t: "2026-05-11T07:00"}
            ];
            let report = "61艇伙食統計表\n\n";
            times.forEach(tm => { report += `${tm.n}：${getEaters(tm.t)}\n`; });
            navigator.clipboard.writeText(report).then(() => alert("伙食清單已複製！已依歸營時間與職代自動過濾。"));
        }

        function copyStatusReport() {
            let text = "61艇人員動態回報\n";
            ['外宿', '放假班', '輪休', '慰休', '喪假', '事假', '病假'].forEach(s => {
                const f = allIds.filter(id => memberStates[id]?.status === s).map(id => {
                    const d = memberStates[id];
                    const dateInfo = (d.start && d.end) ? `(${d.start.slice(8,10)}-${d.end.slice(8,10)})` : "";
                    return id + dateInfo;
                });
                if (f.length > 0) text += `${s}：${f.join('、')}\n`;
            });
            const pre = allIds.filter(id => memberStates[id]?.preLeave).map(id => {
                const d = memberStates[id];
                const dateInfo = (d.preStart && d.preEnd) ? `(${d.preStart.slice(8,10)}-${d.preEnd.slice(8,10)})` : "";
                return id + dateInfo;
            });
            if (pre.length > 0) text += `預放：${pre.join('、')}\n`;
            navigator.clipboard.writeText(text).then(() => alert("動態回報(含日期)已複製"));
        }
        window.onload = initApp;
    </script>
</body>
</html>
